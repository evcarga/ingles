  /* ── Apéndice B: AmE vs BrE [americano, británico, español] ── */
  const AMBR = [
    ['apartment', 'flat', 'apartamento'], ['elevator', 'lift', 'ascensor'], ['subway', 'underground', 'metro'],
    ['cell phone', 'mobile', 'celular'], ['fall', 'autumn', 'otoño'], ['soccer', 'football', 'fútbol'],
    ['restroom', 'toilet', 'baño'], ['french fries', 'chips', 'papas fritas'], ['cookie', 'biscuit', 'galleta'],
    ['candy', 'sweets', 'dulces'], ['gas', 'petrol', 'gasolina'], ['vacation', 'holiday', 'vacaciones'],
    ['store', 'shop', 'tienda'], ['line', 'queue', 'fila'], ['trash', 'rubbish', 'basura'],
    ['pants', 'trousers', 'pantalones'], ['sneakers', 'trainers', 'tenis']
  ];
  // El tema A muestra la tabla completa de verbos en su bloque FORM
  if (GRAM_BY_ID['A']) {
    GRAM_BY_ID['A'].form = GRAM_BY_ID['A'].form.replace('<div id="gram-irr-tabla"></div>',
      gTable(['Base', 'Past', 'Español'], IRR_VERBS.map(v => [v[0], `<b>${v[1]}</b>`, v[2]])));
    // Quiz autogenerado: pasado de cada verbo con distractores reales
    GRAM_BY_ID['A'].quiz = gShuffle(IRR_VERBS.filter(v => v[0] !== 'be')).slice(0, 14).map(v => {
      const wrong = gShuffle(IRR_VERBS.filter(x => x[1] !== v[1])).slice(0, 2).map(x => x[1]);
      const o = gShuffle([v[1], ...wrong]);
      return { q: `El pasado de "${v[0]}" (${v[2]}) es ___`, o, a: o.indexOf(v[1]), w: `${v[0]} → ${v[1]}` };
    });
  }
  if (GRAM_BY_ID['B']) {
    GRAM_BY_ID['B'].quiz = gShuffle(AMBR).slice(0, 12).map(p => {
      const o = gShuffle([p[0], p[1]]);
      return { q: `🇺🇸 En inglés AMERICANO, "${p[2]}" = ___`, o, a: o.indexOf(p[0]), w: `AmE: ${p[0]} · BrE: ${p[1]}` };
    });
  }

  const GRAM_PARTES = [
    { n: 0, icon: '🧱', t: 'Fundamentos' },
    { n: 1, icon: '📦', t: 'Sustantivos y determinantes' },
    { n: 2, icon: '👤', t: 'Pronombres' },
    { n: 3, icon: '⚡', t: 'Verbos' },
    { n: 4, icon: '🎨', t: 'Adjetivos y adverbios' },
    { n: 5, icon: '📍', t: 'Preposiciones' },
    { n: 6, icon: '🧩', t: 'Construir oraciones' },
    { n: 7, icon: '🛠️', t: 'Gramática funcional' },
    { n: 8, icon: '🏆', t: 'Extras y trampas' }
  ];

  /* ── estado persistente (flujo.gram) ── */
  function ensureGram() {
    if (!flujo.gram) flujo.gram = { v: 1, topics: {}, errores: [], cfg: { quizLen: 7, autoEs: false } };
    if (!flujo.gram.topics) flujo.gram.topics = {};
    if (!flujo.gram.errores) flujo.gram.errores = [];
    if (!flujo.gram.cfg) flujo.gram.cfg = { quizLen: 7, autoEs: false };
    return flujo.gram;
  }
  function gramT(id) {
    const g = ensureGram();
    if (!g.topics[id]) g.topics[id] = { stars: 0, best: 0, tries: 0, seen: false, fav: false };
    return g.topics[id];
  }
  function gramStarsTotal() { const g = ensureGram(); let s = 0; GRAM_TOPICS.forEach(t => s += (g.topics[t.id]?.stars || 0)); return s; }
  function gramDoneCount() { const g = ensureGram(); return GRAM_TOPICS.filter(t => (g.topics[t.id]?.stars || 0) > 0).length; }

  /* ── PANTALLA PRINCIPAL: temario ── */
  function openGramatica() {
    if (!flujo) return;
    ensureGram();
    stopSpeaking(); window.scrollTo(0, 0);
    const g = flujo.gram;
    const total = GRAM_TOPICS.length, stars = gramStarsTotal();
    const pct = Math.round(100 * stars / (3 * total));
    updateProgressBar(pct);
    const next = GRAM_TOPICS.find(t => !(g.topics[t.id]?.stars > 0));
    const favs = GRAM_TOPICS.filter(t => g.topics[t.id]?.fav);
    const nErr = g.errores.length;

    const fila = (t) => {
      const st = g.topics[t.id] || {};
      return `<button data-gt="${t.id}" class="gt-row w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-orange-50 text-left transition">
        <span class="text-2xl w-8 text-center shrink-0">${t.icon}</span>
        <span class="flex-1 min-w-0">
          <span class="block font-bold text-slate-700 truncate">${t.en}</span>
          <span class="block text-[11px] text-slate-400 truncate">${t.es}</span>
        </span>
        ${st.fav ? '<i class="fas fa-heart text-pink-400 text-xs shrink-0"></i>' : ''}
        <span class="text-sm ${st.stars ? 'text-yellow-400' : 'text-slate-200'} shrink-0">${'★'.repeat(st.stars || 0)}${'☆'.repeat(3 - (st.stars || 0))}</span>
      </button>`;
    };

    appContainer.innerHTML = `
      <div class="animate-pop">
        <div class="card-3d p-5 mb-4 mt-2">
          <div class="flex items-center gap-3">
            <div class="text-4xl">📚</div>
            <div class="flex-1 min-w-0">
              <h1 class="font-heading font-bold text-xl text-slate-800 leading-tight">Gramática A1</h1>
              <p class="text-[11px] text-slate-400">Inglés americano · ${total} temas · ${stars}/${total * 3} ★</p>
            </div>
            <button id="gram-cfg" class="tool-btn text-slate-400 hover:text-slate-600 text-lg px-2" title="Personalizar"><i class="fas fa-sliders"></i></button>
            <button id="gram-exit" class="tool-btn text-slate-400 hover:text-slate-600 text-lg px-2" title="Volver a mis palabras"><i class="fas fa-xmark"></i></button>
          </div>
          <div class="progress-track mt-3"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="grid grid-cols-2 gap-2 mt-4">
            ${next
              ? `<button id="gram-next" class="btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl">${g.topics[next.id]?.seen ? 'Continuar' : 'Empezar'} ${next.icon}</button>`
              : `<button id="gram-next" class="btn-juice bg-green-500 text-white font-bold py-3 rounded-xl">¡Nivel completo! 🏆</button>`}
            <button id="gram-reto" class="btn-juice bg-indigo-500 text-white font-bold py-3 rounded-xl">Reto rápido ⚡</button>
          </div>
          ${nErr ? `<button id="gram-errs" class="w-full mt-2 btn-juice bg-amber-400 text-white font-bold py-2.5 rounded-xl text-sm">✏️ Repasar mis errores (${nErr})</button>` : ''}
        </div>
        ${favs.length ? `<div class="card-3d p-3 mb-4"><p class="px-2 pt-1 pb-2 text-[11px] font-black text-pink-400 uppercase">❤️ Mis favoritos</p>${favs.map(fila).join('')}</div>` : ''}
        ${GRAM_PARTES.map(P => {
          const ts = GRAM_TOPICS.filter(t => t.p === P.n);
          if (!ts.length) return '';
          const d = ts.filter(t => (g.topics[t.id]?.stars || 0) > 0).length;
          return `<div class="card-3d p-3 mb-4">
            <p class="px-2 pt-1 pb-2 text-[11px] font-black text-slate-400 uppercase">${P.icon} Parte ${P.n} · ${P.t} <span class="float-right ${d === ts.length ? 'text-green-500' : ''}">${d}/${ts.length}</span></p>
            ${ts.map(fila).join('')}
          </div>`;
        }).join('')}
      </div>`;

    document.querySelectorAll('.gt-row').forEach(b => b.onclick = () => gramLesson(b.dataset.gt));
    document.getElementById('gram-exit').onclick = () => runFlow();
    document.getElementById('gram-cfg').onclick = gramConfig;
    document.getElementById('gram-next').onclick = () => next ? gramLesson(next.id) : gramReto();
    document.getElementById('gram-reto').onclick = gramReto;
    const be = document.getElementById('gram-errs');
    if (be) be.onclick = gramRepasoErrores;
  }

  /* ── LECCIÓN: Aprender / Ejemplos / Practicar ── */
  function gramLesson(id, tab = 'learn') {
    const t = GRAM_BY_ID[id];
    if (!t) return openGramatica();
    stopSpeaking(); window.scrollTo(0, 0);
    const st = gramT(id);
    if (!st.seen) { st.seen = true; updateUserFlow(); }
    const tabBtn = (k, label) => `<button data-tab="${k}" class="gl-tab flex-1 py-2 rounded-xl font-bold text-[13px] ${tab === k ? 'bg-[#FF7A00] text-white shadow' : 'text-slate-500 hover:bg-slate-100'}">${label}</button>`;

    appContainer.innerHTML = `
      <div class="animate-pop">
        <div class="flex items-center gap-2 mt-2 mb-3">
          <button id="gl-back" class="tool-btn bg-white border border-slate-200 rounded-xl w-10 h-10 text-slate-500 shrink-0"><i class="fas fa-arrow-left"></i></button>
          <div class="flex-1 min-w-0">
            <h1 class="font-heading font-bold text-lg text-slate-800 leading-tight truncate">${t.icon} ${t.en}</h1>
            <p class="text-[11px] text-slate-400 truncate">${t.es} · ${t.tag}</p>
          </div>
          <button id="gl-fav" class="tool-btn text-xl ${st.fav ? 'text-pink-500' : 'text-slate-300'} shrink-0" title="Favorito"><i class="fas fa-heart"></i></button>
          <span class="text-sm ${st.stars ? 'text-yellow-400' : 'text-slate-300'} shrink-0">${'★'.repeat(st.stars || 0)}${'☆'.repeat(3 - (st.stars || 0))}</span>
        </div>
        <div class="flex gap-1 bg-white border border-slate-200 rounded-2xl p-1 mb-4">
          ${tabBtn('learn', '📖 Aprender')}${tabBtn('ex', '✨ Ejemplos')}${tabBtn('quiz', '🎯 Practicar')}
        </div>
        <div id="gl-body"></div>
      </div>`;
    document.getElementById('gl-back').onclick = openGramatica;
    document.getElementById('gl-fav').onclick = () => { st.fav = !st.fav; updateUserFlow(); gramLesson(id, tab); };
    document.querySelectorAll('.gl-tab').forEach(b => b.onclick = () => gramLesson(id, b.dataset.tab));
    if (tab === 'learn') gramTabLearn(t);
    else if (tab === 'ex') gramTabEjemplos(t);
    else gramStartTopicQuiz(t);
  }

  function gramExRow(e) {
    const auto = ensureGram().cfg.autoEs;
    return `<div class="gx-item bg-slate-50 rounded-xl px-3 py-2.5 mb-2" data-en="${escapeHTML(e.en)}">
      <div class="flex items-center gap-2">
        <button class="gx-audio text-[#FF7A00] w-8 h-8 rounded-full bg-orange-100 shrink-0" title="Escuchar"><i class="fas fa-volume-up text-sm"></i></button>
        <p class="flex-1 font-bold text-slate-700">${e.en}</p>
      </div>
      <p class="gx-es ${auto ? '' : 'hidden'} text-[12px] text-slate-400 mt-1 pl-10">${e.es}</p>
      ${auto ? '' : '<button class="gx-toggle text-[10px] font-bold text-slate-300 hover:text-slate-500 pl-10 mt-0.5">ver traducción</button>'}
    </div>`;
  }
  function gramWireEx(body) {
    body.addEventListener('click', (e) => {
      const a = e.target.closest('.gx-audio');
      if (a) { const it = a.closest('.gx-item'); speak(it.dataset.en); return; }
      const tg = e.target.closest('.gx-toggle');
      if (tg) { const it = tg.closest('.gx-item'); it.querySelector('.gx-es').classList.remove('hidden'); tg.remove(); sfx('flip'); }
    });
  }

  function gramTabLearn(t) {
    const body = document.getElementById('gl-body');
    body.innerHTML = `
      <div class="card-3d p-4 mb-4">
        <p class="text-[11px] font-black text-slate-400 uppercase mb-2">📐 Estructura · FORM</p>
        <div class="text-sm text-slate-700 leading-relaxed">${t.form}</div>
      </div>
      <div class="card-3d p-4 mb-4">
        <p class="text-[11px] font-black text-slate-400 uppercase mb-2">💬 Así se usa</p>
        ${t.ex.map(gramExRow).join('')}
      </div>
      <div class="rounded-2xl border-2 border-amber-200 bg-amber-50 p-4 mb-4">
        <p class="text-[11px] font-black text-amber-500 uppercase mb-1">🔑 La clave (en español)</p>
        <p class="text-sm text-amber-900 leading-relaxed">${t.tip}</p>
      </div>
      ${t.errs?.length ? `<div class="card-3d p-4 mb-4">
        <p class="text-[11px] font-black text-slate-400 uppercase mb-2">⚠️ Errores típicos del hispanohablante</p>
        ${t.errs.map(e => `
          <div class="mb-3 last:mb-0">
            <p class="text-sm text-red-400 font-bold">❌ <s>${e.b}</s></p>
            <p class="text-sm text-green-600 font-bold">✅ ${e.g}</p>
            <p class="text-[11px] text-slate-400 mt-0.5">${e.w}</p>
          </div>`).join('')}
      </div>` : ''}
      <button id="gl-cta" class="w-full btn-juice bg-[#FF7A00] text-white font-black py-4 rounded-2xl text-lg mb-6">🎯 ¡Practicar este tema!</button>`;
    document.getElementById('gl-cta').onclick = () => gramLesson(t.id, 'quiz');
    gramWireEx(body);
  }

  /* ── EJEMPLOS ∞: generador ── */
  const gramExSession = {};
  function gramNewExamples(t, n = 3) {
    const seen = new Set((gramExSession[t.id] || []).map(e => e.en));
    (t.ex || []).forEach(e => seen.add(e.en));
    const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 80) {
      let e = null;
      if (t.gen) e = t.gen();
      if ((!e || seen.has(e.en)) && t.extra?.length) { const x = gPick(t.extra); e = { en: x[0], es: x[1] }; }
      if (e && !seen.has(e.en)) { seen.add(e.en); out.push(e); }
    }
    if (!out.length) {
      const pool = [...(t.extra || []).map(x => ({ en: x[0], es: x[1] })), ...(t.ex || [])];
      if (pool.length) out.push(gPick(pool));
    }
    return out;
  }
  function gramTabEjemplos(t) {
    const body = document.getElementById('gl-body');
    if (!gramExSession[t.id]) gramExSession[t.id] = gramNewExamples(t, 4);
    body.innerHTML = `
      <div class="card-3d p-4 mb-4">
        <p class="text-[11px] font-black text-slate-400 uppercase mb-1">✨ Ejemplos para ti</p>
        <p class="text-[11px] text-slate-400 mb-3">Toca 🔊 para escuchar. Intenta traducir ANTES de mirar la traducción: así se fija mejor. 🧠</p>
        <div id="gx-list">${gramExSession[t.id].map(gramExRow).join('')}</div>
        <button id="gx-more" class="w-full btn-juice bg-indigo-500 text-white font-bold py-3 rounded-xl mt-2">✨ Generar más ejemplos</button>
      </div>
      <button id="gl-cta2" class="w-full btn-juice bg-[#FF7A00] text-white font-black py-4 rounded-2xl text-lg mb-6">🎯 ¡Ahora practica!</button>`;
    document.getElementById('gx-more').onclick = () => {
      const nuevos = gramNewExamples(t, 3);
      gramExSession[t.id].push(...nuevos);
      const list = document.getElementById('gx-list');
      nuevos.forEach(e => list.insertAdjacentHTML('beforeend', gramExRow(e)));
      sfx('toast');
      list.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    document.getElementById('gl-cta2').onclick = () => gramLesson(t.id, 'quiz');
    gramWireEx(body);
  }

  /* ── QUIZ ── */
  let gramQuiz = null;
  function gramQsOfTopic(t) {
    const qs = [];
    (t.quiz || []).forEach((q, i) => qs.push({ k: 'mc', t: t.id, i, q: q.q, o: q.o, a: q.a, w: q.w }));
    (t.errs || []).forEach((e, i) => qs.push({ k: 'pick', t: t.id, i, b: e.b, g: e.g, w: e.w }));
    if (!t.noOrder) {
      const base = [...(t.ex || [])];
      if (t.gen) for (let j = 0; j < 3; j++) { const e = t.gen(); if (e) base.push(e); }
      gShuffle(base.filter(e => { const n = e.en.split(' ').length; return n >= 3 && n <= 8 && !/[—→]/.test(e.en); }))
        .slice(0, 3).forEach(e => qs.push({ k: 'order', t: t.id, en: e.en, es: e.es }));
    }
    return qs;
  }
  function gramStartTopicQuiz(t) {
    const n = ensureGram().cfg.quizLen || 7;
    gramQuiz = { list: gShuffle(gramQsOfTopic(t)).slice(0, n), i: 0, ok: 0, streak: 0, pts: 0, mode: 'topic', topic: t.id };
    gramRenderQ();
  }
  function gramReto() {
    const pool = [];
    GRAM_TOPICS.forEach(t => gramQsOfTopic(t).forEach(q => pool.push(q)));
    gramQuiz = { list: gShuffle(pool).slice(0, 10), i: 0, ok: 0, streak: 0, pts: 0, mode: 'reto' };
    gramRenderQ();
    showToast('⚡ Reto rápido: 10 preguntas de todo el nivel. ¡A por ellas!');
  }
  function gramQuizExit() {
    stopSpeaking();
    const m = gramQuiz?.mode, tp = gramQuiz?.topic;
    gramQuiz = null;
    if (m === 'topic') gramLesson(tp, 'learn'); else openGramatica();
  }

  function gramRenderQ() {
    const S = gramQuiz;
    if (!S) return;
    if (S.i >= S.list.length) return gramQuizEnd();
    const q = S.list[S.i];
    window.scrollTo(0, 0);
    const tt = GRAM_BY_ID[q.t];
    let bodyHTML = '', titulo = '';
    if (q.k === 'mc') {
      titulo = 'Completa la frase';
      S.opts = gShuffle(q.o.map((o, i) => ({ o, i })));
      bodyHTML = `
        <p class="text-lg font-bold text-slate-800 text-center my-5 leading-relaxed">${q.q.replace('___', '<span class="inline-block min-w-[64px] border-b-4 border-[#FF7A00] text-[#FF7A00]">&nbsp;___&nbsp;</span>')}</p>
        <div class="space-y-2">${S.opts.map((x, j) => `<button data-j="${j}" class="gq-opt w-full btn-juice bg-white border-2 border-slate-200 font-bold text-slate-700 py-3.5 rounded-xl text-base">${x.o}</button>`).join('')}</div>`;
    } else if (q.k === 'pick') {
      titulo = '¿Cuál es la frase correcta?';
      S.opts = gShuffle([{ o: q.g, ok: true }, { o: q.b, ok: false }]);
      bodyHTML = `<div class="space-y-3 mt-5">${S.opts.map((x, j) => `<button data-j="${j}" class="gq-opt w-full btn-juice bg-white border-2 border-slate-200 font-bold text-slate-700 py-4 px-3 rounded-xl text-base leading-snug">${x.o}</button>`).join('')}</div>`;
    } else {
      titulo = 'Ordena la frase';
      const punct = (q.en.match(/[.!?]$/) || ['.'])[0];
      const words = q.en.replace(/[.!?]$/, '').split(' ');
      S.order = { words, sel: [], punct };
      bodyHTML = `
        <p class="text-center text-slate-400 text-sm mt-4 mb-1">Pista: <i>${q.es}</i></p>
        <div id="gq-built" class="min-h-[52px] bg-white border-2 border-dashed border-slate-300 rounded-xl p-2 flex flex-wrap gap-1.5 my-3"></div>
        <div id="gq-pool" class="flex flex-wrap gap-1.5 justify-center mb-4">
          ${gShuffle(words.map((w, i) => ({ w, i }))).map(x => `<button data-i="${x.i}" class="gq-chip btn-juice bg-white border-2 border-slate-200 font-bold text-slate-700 px-3 py-2 rounded-xl">${x.w}</button>`).join('')}
        </div>
        <button id="gq-check" disabled class="w-full btn-juice bg-slate-300 text-white font-bold py-3 rounded-xl">Comprobar</button>`;
    }
    appContainer.innerHTML = `
      <div class="animate-pop mt-2">
        <div class="flex items-center gap-2 mb-1">
          <button id="gq-exit" class="tool-btn text-slate-400 text-xl px-2"><i class="fas fa-xmark"></i></button>
          <div class="flex-1 progress-track"><div class="progress-fill" style="width:${Math.round(100 * S.i / S.list.length)}%"></div></div>
          <span class="text-xs font-black text-slate-400">${S.i + 1}/${S.list.length}</span>
          ${S.streak >= 3 ? `<span class="text-xs font-black text-orange-500">🔥${S.streak}</span>` : ''}
        </div>
        <p class="text-center text-[11px] font-black uppercase text-slate-400 mt-3">${tt ? tt.icon + ' ' : ''}${titulo}</p>
        <div class="card-3d p-4 mt-2">${bodyHTML}<div id="gq-fb"></div></div>
      </div>`;
    document.getElementById('gq-exit').onclick = gramQuizExit;
    sfx('flip');
    if (q.k === 'order') gramWireOrder();
    else document.querySelectorAll('.gq-opt').forEach(b => b.onclick = () => gramAnswer(parseInt(b.dataset.j)));
  }

  function gramWireOrder() {
    const S = gramQuiz, st = S.order;
    const built = document.getElementById('gq-built'), pool = document.getElementById('gq-pool'), check = document.getElementById('gq-check');
    const paint = () => {
      built.innerHTML = st.sel.map((i, pos) => `<button data-pos="${pos}" class="gb-chip bg-orange-100 border-2 border-orange-200 text-[#FF7A00] font-bold px-3 py-2 rounded-xl">${st.words[i]}</button>`).join('');
      pool.querySelectorAll('.gq-chip').forEach(c => {
        const usado = st.sel.includes(parseInt(c.dataset.i));
        c.classList.toggle('opacity-30', usado);
        c.disabled = usado;
      });
      const listo = st.sel.length === st.words.length;
      check.disabled = !listo;
      check.className = `w-full btn-juice ${listo ? 'bg-[#FF7A00]' : 'bg-slate-300'} text-white font-bold py-3 rounded-xl`;
    };
    pool.onclick = (e) => { const c = e.target.closest('.gq-chip'); if (!c || c.disabled) return; st.sel.push(parseInt(c.dataset.i)); sfx('click'); paint(); };
    built.onclick = (e) => { const c = e.target.closest('.gb-chip'); if (!c) return; st.sel.splice(parseInt(c.dataset.pos), 1); paint(); };
    check.onclick = () => {
      if (st.sel.length !== st.words.length) return;
      const frase = st.sel.map(i => st.words[i]).join(' ');
      gramResolve(frase === st.words.join(' '), { correcta: st.words.join(' ') + st.punct });
    };
    paint();
  }

  function gramAnswer(j) {
    const S = gramQuiz, q = S.list[S.i], x = S.opts[j];
    const ok = (q.k === 'mc') ? (x.i === q.a) : !!x.ok;

  /* ── Mis errores (se guardan y se pueden repasar) ── */
  function gramErrKey(q) { return q.k + '|' + q.t + '|' + (q.k === 'order' ? q.en : q.i); }
  function gramGuardarError(q) {
    const g = ensureGram();
    const key = gramErrKey(q);
    if (g.errores.some(d => gramErrKey(d) === key)) return;
    const d = { k: q.k, t: q.t };
    if (q.k === 'order') { d.en = q.en; d.es = q.es; } else d.i = q.i;
    g.errores.push(d);
    if (g.errores.length > 40) g.errores.shift();
    updateUserFlow();
  }
  function gramBorrarError(q) {
    const g = ensureGram();
    const key = gramErrKey(q);
    const ix = g.errores.findIndex(d => gramErrKey(d) === key);
    if (ix >= 0) { g.errores.splice(ix, 1); updateUserFlow(); }
  }
  function gramQFromDesc(d) {
    const t = GRAM_BY_ID[d.t];
    if (!t) return null;
    if (d.k === 'mc') { const q = t.quiz?.[d.i]; return q ? { k: 'mc', t: d.t, i: d.i, q: q.q, o: q.o, a: q.a, w: q.w } : null; }
    if (d.k === 'pick') { const e = t.errs?.[d.i]; return e ? { k: 'pick', t: d.t, i: d.i, b: e.b, g: e.g, w: e.w } : null; }
    if (d.k === 'order') return { k: 'order', t: d.t, en: d.en, es: d.es };
    return null;
  }
  function gramRepasoErrores() {
    const g = ensureGram();
    const list = gShuffle(g.errores.map(gramQFromDesc).filter(Boolean)).slice(0, 10);

  }

  /* ============================================================
     15.5. TRADUCTOR — buscador español ⇄ inglés
     ------------------------------------------------------------
     Busca sobre la tabla "palabras" en LOS DOS SENTIDOS.

     El detalle importante: la columna "espanol" muchas veces trae
     VARIOS significados separados por comas, p. ej.
        ingles: "that"  ·  espanol: "ese, esa, eso, aquel, aquella, que"
     Un simple LIKE deja fuera a quien escribe "aquella" o "eso" y
     además ordena fatal (una coincidencia parcial pesa lo mismo que
     una exacta). Aquí cada significado se separa y se puntúa por
     separado, así que "aquella" encuentra "that" y sale de primero.

     También es insensible a acentos y mayúsculas ("mama" = "mamá"),
     tolera erratas ("hause" → "¿house?") y permite oír la palabra
     o mandarla al mazo sin salir del modal.
  ============================================================ */
  const TR_MAX_LOCAL = 8000;   // tope para cargar el diccionario en memoria
  const TR_MAX_RESULTS = 40;
  let trIndice = null;         // entradas preparadas (modo local)
  let trCarga = null;          // promesa de carga en curso
  let trModo = 'local';        // 'local' (todo en memoria) | 'remoto' (consulta por consulta)
  let trDir = 'auto';          // 'auto' | 'es' (escribo español) | 'en' (escribo inglés)
  let trUltimaBusqueda = 0;

  // Quita acentos SIN cambiar la longitud del texto (1 carácter → 1 carácter),
  // para poder resaltar la coincidencia sobre el texto original.
  const TR_MARCAS = new RegExp('[\\u0300-\\u036f]', 'g');   // tildes/diéresis ya separadas por NFD
  const trSinAcentos = (s) => (s || '').toString().normalize('NFD').replace(TR_MARCAS, '');
  const trHKey = (s) => trSinAcentos(s).toLowerCase();                  // conserva longitud
  const trKey = (s) => trHKey(s).replace(/[.,;:!?¡¿"'()[\]/|]/g, ' ').replace(/\s+/g, ' ').trim();

  // "ese, esa, eso; aquel / aquella" → ["ese","esa","eso","aquel","aquella"]
  const trPartes = (txt) => (txt || '').toString().split(/[,;/|]|\s+o\s+/i)
    .map(s => s.trim()).filter(Boolean);

  // Deja cada fila de "palabras" lista para buscar (se calcula UNA vez).
  function trPreparar(w) {
    const esPartes = trPartes(w.espanol);
    const enPartes = trPartes(w.ingles);
    return {
      w,
      esPartes: esPartes.length ? esPartes : [(w.espanol || '').trim()],
      enPartes: enPartes.length ? enPartes : [(w.ingles || '').trim()],
      esKeys: [...new Set([...esPartes.map(trKey), trKey(w.espanol)])].filter(Boolean),
      enKeys: [...new Set([...enPartes.map(trKey), trKey(w.ingles)])].filter(Boolean)
    };
  }

  // Puntuación de un término contra lo que escribió la persona.
  // Exacta > empieza por > palabra completa dentro de la frase > contiene.
  function trPuntajeTermino(termino, qk) {
    if (!termino || !qk) return 0;
    if (termino === qk) return 100;
    if (termino.startsWith(qk + ' ')) return 84;
    if (termino.startsWith(qk)) return 78;
    if (termino.includes(' ' + qk + ' ') || termino.endsWith(' ' + qk)) return 66;
    if (termino.includes(qk)) return 46;
    return 0;
  }

  function trEvaluar(e, qk) {
    let puntaje = 0, lado = null, largo = 0;
    const revisar = (keys, cual) => keys.forEach(t => {
      const p = trPuntajeTermino(t, qk);
      if (p > puntaje || (p === puntaje && p > 0 && t.length < largo)) {
        puntaje = p; lado = cual; largo = t.length;
      }
    });
    if (trDir === 'auto' || trDir === 'en') revisar(e.enKeys, 'en');
    if (trDir === 'auto' || trDir === 'es') revisar(e.esKeys, 'es');
    return { puntaje, lado, largo };
  }

  // Distancia de edición acotada: solo para sugerir "¿quisiste decir...?"
  function trDistancia(a, b, tope = 2) {
    if (Math.abs(a.length - b.length) > tope) return tope + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const fila = [i];
      let minFila = i;
      for (let j = 1; j <= b.length; j++) {
        const costo = a[i - 1] === b[j - 1] ? 0 : 1;
        fila[j] = Math.min(prev[j] + 1, fila[j - 1] + 1, prev[j - 1] + costo);
        if (fila[j] < minFila) minFila = fila[j];
      }
      if (minFila > tope) return tope + 1;   // corte temprano
      prev = fila;
    }
    return prev[b.length];
  }

  // ---------- Carga del diccionario ----------
  // PostgREST corta en 1000 filas, así que se pagina. Si la tabla es enorme
  // no se descarga: se pasa a modo "remoto" y cada búsqueda va al servidor.
  function trCargarDiccionario() {
    if (trIndice) return Promise.resolve(trIndice);
    if (trCarga) return trCarga;
    trCarga = (async () => {
      const { count, error: cErr } = await dbClient.from('palabras').select('id', { count: 'exact', head: true });
      if (cErr) { console.warn('[traductor] no se pudo contar "palabras":', cErr.message); trModo = 'remoto'; return null; }
      if ((count || 0) > TR_MAX_LOCAL) { trModo = 'remoto'; return null; }

      const COLS = 'id,ingles,espanol,fonetica,imagen,audio,nivel,grupo';
      const PAGINA = 1000;
      const filas = [];
      for (let desde = 0; ; desde += PAGINA) {
        let { data, error } = await dbClient.from('palabras').select(COLS).order('id').range(desde, desde + PAGINA - 1);
        if (error) {   // por si alguna columna no existe en este proyecto
          ({ data, error } = await dbClient.from('palabras').select('*').order('id').range(desde, desde + PAGINA - 1));
        }
        if (error) { console.warn('[traductor] carga:', error.message); trModo = 'remoto'; return null; }
        filas.push(...(data || []));
        if ((data || []).length < PAGINA) break;
      }
      trModo = 'local';
      trIndice = filas.map(trPreparar);
      console.log('[traductor] diccionario en memoria:', trIndice.length, 'palabras');
      return trIndice;
    })().catch(err => { console.warn('[traductor]', err); trModo = 'remoto'; return null; })
      .finally(() => { trCarga = null; });
    return trCarga;
  }

  // Búsqueda contra el servidor (tablas grandes o si falló la carga local).
  async function trBuscarRemoto(q) {
    const variantes = [...new Set([q, trSinAcentos(q)])]
      .map(s => s.replace(/[%,()*]/g, ' ').trim()).filter(Boolean);
    if (!variantes.length) return [];
    const campos = trDir === 'es' ? ['espanol'] : trDir === 'en' ? ['ingles'] : ['ingles', 'espanol'];
    const vistos = new Set(); const out = [];
    for (const v of variantes) {
      const filtro = campos.map(c => `${c}.ilike.%${v}%`).join(',');
      const { data, error } = await dbClient.from('palabras').select('*').or(filtro).limit(80);
      if (error) { console.warn('[traductor] búsqueda remota:', error.message); continue; }
      (data || []).forEach(w => { if (!vistos.has(w.id)) { vistos.add(w.id); out.push(trPreparar(w)); } });
    }
    return out;
  }

  // ---------- Resaltado ----------
  function trResaltar(texto, q) {
    const original = (texto || '').toString();
    const qh = trHKey(q).trim();
    if (!qh) return escapeHTML(original);
    const i = trHKey(original).indexOf(qh);
    if (i < 0) return escapeHTML(original);
    return escapeHTML(original.slice(0, i)) +
      `<mark class="bg-orange-100 text-[#FF7A00] rounded px-0.5">${escapeHTML(original.slice(i, i + qh.length))}</mark>` +
      escapeHTML(original.slice(i + qh.length));
  }

  // ---------- Modal ----------
  function openTraductor() {
    trDir = 'auto';
    const chip = (dir, txt) => `<button data-dir="${dir}" class="tr-chip btn-juice ${dir === 'auto' ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl">${txt}</button>`;

    showModal({
      icon: '🔤', title: 'Traductor', size: 'lg',
      body: `
        <div class="text-left">
          <p class="text-slate-400 text-xs text-center mb-3">Escribe en <b>español</b> o en <b>inglés</b>: encuentro la palabra en cualquiera de los dos sentidos.</p>
          <div class="relative mb-3">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
            <input id="tr-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="ej: aquella, house, correr…"
              class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl pl-10 pr-10 py-3 font-bold text-slate-700 focus:outline-none focus:border-[#FF7A00]">
            <button id="tr-clear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 text-xl leading-none" title="Limpiar">&times;</button>
          </div>
          <div class="flex justify-center gap-1.5 mb-3">
            ${chip('auto', '🔎 Ambos')}
            ${chip('es', '🇪🇸 → 🇬🇧')}
            ${chip('en', '🇬🇧 → 🇪🇸')}
          </div>
          <div id="tr-results" class="min-h-[8rem] max-h-[46vh] overflow-y-auto"></div>
        </div>`,
      actions: []
    });

    const input = document.getElementById('tr-input');
    const cajaRes = document.getElementById('tr-results');
    const btnClear = document.getElementById('tr-clear');
    if (!input || !cajaRes) return;

    trPintarVacio(cajaRes, 'inicio');
    setTimeout(() => input.focus(), 120);
    // El diccionario se carga en segundo plano: al terminar se repinta el estado inicial
    // (para mostrar cuántas palabras hay) o se repite la búsqueda que ya haya escrito.
    trCargarDiccionario().then(() => {
      if (!document.getElementById('tr-input')) return;   // cerró el modal antes de terminar
      if (input.value.trim()) trBuscar(input.value);
      else trPintarVacio(cajaRes, 'inicio');
    });

    let temporizador = null;
    const lanzar = () => {
      btnClear.classList.toggle('hidden', !input.value);
      clearTimeout(temporizador);
      temporizador = setTimeout(() => trBuscar(input.value), 170);
    };
    input.addEventListener('input', lanzar);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); clearTimeout(temporizador); trBuscar(input.value); }
      if (e.key === 'Escape') closeModal();
    });
    btnClear.onclick = () => { input.value = ''; btnClear.classList.add('hidden'); input.focus(); trPintarVacio(cajaRes, 'inicio'); };

    // Cambio de sentido de búsqueda
    document.querySelectorAll('.tr-chip').forEach(b => {
      b.onclick = () => {
        trDir = b.dataset.dir;
        document.querySelectorAll('.tr-chip').forEach(o => {
          const activo = o.dataset.dir === trDir;
          o.className = `tr-chip btn-juice ${activo ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl`;
        });
        if (input.value.trim()) trBuscar(input.value); else trPintarVacio(cajaRes, 'inicio');
        input.focus();
      };
    });

    // Acciones de cada resultado (delegación: la lista se repinta constantemente)
    cajaRes.addEventListener('click', async (e) => {
      const bAudio = e.target.closest('.tr-audio');
      if (bAudio) { playWordAudio({ ingles: bAudio.dataset.en, audio: bAudio.dataset.audio || null }); return; }

      const bSug = e.target.closest('.tr-sug');
      if (bSug) { input.value = bSug.dataset.q; btnClear.classList.remove('hidden'); trBuscar(input.value); input.focus(); return; }

      const bMazo = e.target.closest('.tr-mazo');
      if (bMazo) {
        bMazo.disabled = true;
        await trAgregarAlMazo(bMazo.dataset.id, bMazo.dataset.en, bMazo.dataset.es, bMazo);
      }
    });
  }

  function trPintarVacio(caja, tipo, q = '') {
    if (tipo === 'inicio') {
      caja.innerHTML = `
        <div class="text-center py-6 text-slate-400">
          <div class="text-4xl mb-2">📖</div>
          <p class="text-sm font-bold text-slate-500">Empieza a escribir</p>
          <p class="text-xs mt-1">${trIndice ? `Busco entre <b>${trIndice.length}</b> palabras del curso` : 'Busco en las palabras del curso'}, con o sin acentos.</p>
        </div>`;
    } else if (tipo === 'cargando') {
      caja.innerHTML = spinnerHTML();
    } else {
      caja.innerHTML = `
        <div class="text-center py-6 text-slate-400">
          <div class="text-4xl mb-2">🤔</div>
          <p class="text-sm font-bold text-slate-500">Sin resultados para “${escapeHTML(q)}”</p>
          <p class="text-xs mt-1">Puede que esa palabra aún no esté en el curso.</p>
        </div>`;
    }
  }

  async function trBuscar(texto) {
    const caja = document.getElementById('tr-results');
    if (!caja) return;
    const q = (texto || '').trim();
    const qk = trKey(q);
    if (!qk) return trPintarVacio(caja, 'inicio');

    const turno = ++trUltimaBusqueda;
    if (!trIndice && trModo === 'local') {
      trPintarVacio(caja, 'cargando');
      await trCargarDiccionario();
      if (turno !== trUltimaBusqueda || !document.getElementById('tr-results')) return;
    }

    let candidatos;
    if (trIndice) {
      candidatos = trIndice;
    } else {
      trPintarVacio(caja, 'cargando');
      candidatos = await trBuscarRemoto(q);
      if (turno !== trUltimaBusqueda || !document.getElementById('tr-results')) return;
    }

    const hallados = [];
    candidatos.forEach(e => {
      const r = trEvaluar(e, qk);
      if (r.puntaje > 0) hallados.push({ e, ...r });
    });

    hallados.sort((a, b) =>
      b.puntaje - a.puntaje ||
      a.largo - b.largo ||
      (a.e.w.ingles || '').localeCompare(b.e.w.ingles || ''));

    if (!hallados.length) {
      trPintarVacio(caja, 'vacio', q);
      // ¿Quisiste decir...? (solo con el diccionario en memoria)
      if (trIndice && qk.length >= 4) {
        const cercanas = [];
        trIndice.forEach(e => {
          const keys = trDir === 'es' ? e.esKeys : trDir === 'en' ? e.enKeys : [...e.enKeys, ...e.esKeys];
          let d = 3;
          keys.forEach(t => { if (Math.abs(t.length - qk.length) <= 2) d = Math.min(d, trDistancia(t, qk)); });
          if (d <= 2) cercanas.push({ e, d });
        });
        cercanas.sort((a, b) => a.d - b.d);
        const top = cercanas.slice(0, 5);
        if (top.length) {
          caja.insertAdjacentHTML('beforeend', `
            <div class="text-center pb-2">
              <p class="text-xs font-bold text-slate-400 mb-2">¿Quisiste decir...?</p>
              <div class="flex flex-wrap justify-center gap-1.5">
                ${top.map(c => `<button class="tr-sug btn-juice bg-orange-50 text-[#FF7A00] border border-orange-200 font-bold text-xs px-3 py-1.5 rounded-xl" data-q="${escapeHTML(c.e.w.ingles)}">${escapeHTML(c.e.w.ingles)}</button>`).join('')}
              </div>
            </div>`);
        }
      }
      return;
    }

    const visibles = hallados.slice(0, TR_MAX_RESULTS);
    caja.innerHTML = `
      <p class="text-[11px] font-bold text-slate-400 mb-2 px-1">
        ${hallados.length} resultado(s)${hallados.length > visibles.length ? ` · mostrando ${visibles.length}` : ''}
      </p>
      ${visibles.map(h => trItemHTML(h, q)).join('')}`;
    caja.scrollTop = 0;
  }

  function trItemHTML({ e, lado }, q) {
    const w = e.w;
    const fon = w.fonetica ? `/${escapeHTML(w.fonetica)}/` : '';
    const img = w.imagen
      ? `<img src="${escapeHTML(w.imagen)}" alt="" loading="lazy" class="w-12 h-12 rounded-xl object-contain bg-slate-50 border border-slate-100 shrink-0">`
      : `<div class="w-12 h-12 rounded-xl bg-slate-50 border border-slate-100 shrink-0 flex items-center justify-center text-slate-300"><i class="fas fa-image"></i></div>`;

    // Los significados que coinciden se muestran primero y resaltados.
    const coincide = (s) => trHKey(s).includes(trHKey(q).trim());
    const partes = [...e.esPartes].sort((a, b) => (coincide(b) ? 1 : 0) - (coincide(a) ? 1 : 0));
    const significados = partes.map(s =>
      `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full mr-1 mb-1 ${coincide(s) ? 'bg-orange-50 text-[#FF7A00] border border-orange-200' : 'bg-slate-100 text-slate-500'}">${trResaltar(s, q)}</span>`
    ).join('');

    const etiquetas = [w.nivel, w.grupo].filter(Boolean)
      .map(t => `<span class="text-[9px] font-black uppercase tracking-wide text-slate-400">${escapeHTML(t)}</span>`).join('<span class="text-slate-200">·</span>');

    return `
      <div class="bg-white border-2 ${lado === 'es' ? 'border-orange-100' : 'border-slate-100'} rounded-2xl p-2.5 mb-2 flex items-center gap-2.5">
        ${img}
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2 flex-wrap">
            <span class="font-heading font-black text-lg text-[#FF7A00] leading-tight">${trResaltar(w.ingles, q)}</span>
            ${fon ? `<span class="font-mono text-[11px] text-slate-400">${fon}</span>` : ''}
          </div>
          <div class="mt-1">${significados}</div>
          ${etiquetas ? `<div class="flex items-center gap-1.5 mt-0.5">${etiquetas}</div>` : ''}
        </div>
        <div class="flex flex-col gap-1 shrink-0">
          <button class="tr-audio w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 transition flex items-center justify-center"
            title="Escuchar" data-en="${escapeHTML(w.ingles)}" data-audio="${escapeHTML(w.audio || '')}"><i class="fas fa-volume-up text-xs"></i></button>
          <button class="tr-mazo w-9 h-9 rounded-full bg-orange-50 hover:bg-orange-100 text-[#FF7A00] transition flex items-center justify-center"
            title="Añadir a mi mazo" data-id="${w.id}" data-en="${escapeHTML(w.ingles)}" data-es="${escapeHTML(w.espanol || '')}"><i class="fas fa-plus text-xs"></i></button>
        </div>
      </div>`;
  }

  // Guarda la palabra en el mazo del usuario (sin duplicar).
  async function trAgregarAlMazo(wordId, ingles, espanol, btn) {
    const marcarOk = () => { btn.innerHTML = '<i class="fas fa-check text-xs"></i>'; btn.className = btn.className.replace('bg-orange-50', 'bg-green-100').replace('text-[#FF7A00]', 'text-green-600'); };
    const { data: ya } = await dbClient.from('mazo').select('id')
      .eq('user_id', currentUser.id).ilike('ingles', ingles).limit(1);
    if ((ya || []).length) { marcarOk(); return showToast(`🃏 “${escapeHTML(ingles)}” ya estaba en tu mazo.`, 1800); }

    const { error } = await dbClient.from('mazo').insert({
      user_id: currentUser.id, ingles, espanol, word_id: parseInt(wordId) || null
    });
    if (error) { btn.disabled = false; console.warn('[traductor] mazo:', error.message); return showToast('⚠️ No se pudo añadir al mazo.', 2200); }
    marcarOk();
    await refreshMazoBadge();
    showToast(`🃏 “${escapeHTML(ingles)}” añadida a tu mazo.`, 2000);
  }

  /* ============================================================
     16. ARRANQUE
  ============================================================ */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data: { session } } = await dbClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      let { data: profile } = await dbClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();

      // Auto-reparación: si el perfil no existe todavía, lo creamos con los datos del registro.
      if (!profile) {
        const meta = currentUser.user_metadata || {};
        const { data: creado, error: upErr } = await dbClient
          .from('profiles')
          .upsert({
            id: currentUser.id,
            full_name: meta.full_name || null,
            phone: meta.phone || null,
            english_group: meta.english_group || null,
            nivel: meta.nivel || 'A1',
            updated_at: new Date().toISOString()
          }, { onConflict: 'id' })
          .select().single();

        if (upErr || !creado) {
          console.error('No se pudo crear/leer el perfil:', upErr);
          renderMessage('⚠️', 'Perfil no encontrado',
            'No pudimos crear tu perfil automáticamente. Probablemente faltan las políticas RLS de la tabla <b>profiles</b>. Aplica el SQL de configuración y vuelve a intentar.');
          return;
        }
        profile = creado;
      }

      userProfile = profile;
      flujo = userProfile.flujo;

      // Restauración anti-pérdida: si el respaldo local es más reciente que la
      // nube (p. ej. la recarga interrumpió el guardado), se usa el local y se
      // vuelve a subir. Así lo ya estudiado NO reaparece desde el inicio.
      try {
        const local = JSON.parse(localStorage.getItem(`abulingo_flujo_${currentUser.id}`) || 'null');
        const tLocal = new Date(local?.savedAt || 0).getTime();
        const tNube = new Date(flujo?.savedAt || 0).getTime();
        if (local && local.version && tLocal > tNube) {
          console.warn('[flujo] respaldo local más reciente que la nube → restaurando avance local');
          flujo = local;
          userProfile.flujo = local;
          dbClient.from('profiles').update({ flujo: local }).eq('id', currentUser.id)
            .then(({ error }) => { if (error) console.error('No se pudo re-subir el respaldo:', error.message); });
        }
      } catch { /* respaldo corrupto: se ignora */ }

      document.getElementById('user-points-display').textContent = userProfile.points || 0;
      fillProfileMenu();

      await ensureFlujo();
      updateStreakUI();
      refreshMazoBadge();      // insignia del botón "M"
      mostrarPistaPerfil();    // "toca tu foto" la primera vez

      // Tutorial de bienvenida: solo la primera vez que entra el usuario.
      if (!flujo.ui?.tutorialSeen) {
        mostrarTutorial(() => runFlow());
      } else {
        await runFlow();
      }
    } catch (e) {
      console.error(e);
      renderMessage('😵', 'Algo salió mal', 'Ocurrió un error al cargar tu sesión. Recarga la página.');
    }
  });
</script>
