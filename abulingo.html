  /* ============================================================
     13. HABLAR CON ABU — práctica de conversación (última misión)
     ------------------------------------------------------------
     Es una práctica más, como las tarjetas o los ejercicios: hay que
     enviar CHAT_GOAL mensajes para completarla y cerrar el grupo.
     Abu contesta corto, corrige al instante y usa las palabras que
     acabas de estudiar. Nunca se presenta como una IA: es Abu.
     Respuestas: Edge Function "generar-dialogo" (mode:"chat").
  ============================================================ */
  function chatPracticeIntro(nivel, group) {
    // Sin modal previo: la charla arranca de una vez.
    startChatPractice(nivel, group, true);
  }
  const CHAT_TIMEOUT_MS = 20000;   // con "thinking" desactivado la respuesta llega en 1-3 s
  let aiChat = [];                 // historial [{role:'user'|'assistant', content}]
  let chatWords = [];              // palabras objetivo de esta charla
  let chatSession = null;          // { nivel, group, counts, count, goal, used:Set, streak }
  let chatModoLocalAvisado = false; // para avisar una sola vez si falla la Edge Function

  // Últimas N palabras estudiadas (con registro SRS), ordenadas por fecha de estudio.
  async function getStudiedWords(max = 10) {
    const ids = Object.entries(flujo.srs)
      .sort((a, b) => new Date(b[1].updated || 0) - new Date(a[1].updated || 0))
      .slice(0, max)
      .map(([id]) => parseInt(id))
      .filter(n => !isNaN(n));
    if (!ids.length) return [];
    const { data, error } = await dbClient.from('palabras').select('id, ingles').in('id', ids);
    if (error) { console.warn('[Abu] no se pudieron leer palabras estudiadas:', error.message); return []; }
    const porId = new Map((data || []).map(w => [w.id, w.ingles]));
    return ids.map(id => porId.get(id)).filter(Boolean);
  }

  // Palabras objetivo: las del grupo que se acaba de practicar; si no hay, las últimas estudiadas.
  async function getChatWords(nivel, group, max = 10) {
    let list = [];
    if (nivel && group) {
      const words = await getGroupWords(nivel, group);
      list = words.map(w => w.ingles).filter(Boolean);
    }
    if (!list.length) list = await getStudiedWords(max);
    return [...new Set(list.map(w => String(w).trim()).filter(Boolean))].slice(0, max);
  }

  /*
    Llamada a la Edge Function. Reintenta una vez y, si aun así falla,
    devuelve null para que la charla continúe con una respuesta local
    (nunca se corta la práctica con "no pude responder").
  */
  async function callChatFunction(body, reintentos = 1) {
    for (let intento = 0; intento <= reintentos; intento++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CHAT_TIMEOUT_MS);
      try {
        const { data: { session } } = await dbClient.auth.getSession();
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/generar-dialogo`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${session?.access_token || SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        let payload = null;
        try { payload = await resp.json(); } catch { /* respuesta no JSON */ }
        if (!resp.ok || payload?.error) {
          throw new Error(`${payload?.error || 'HTTP ' + resp.status}${payload?.motivo ? ' · ' + payload.motivo : ''}`);
        }
        const en = (payload?.reply?.en || '').trim();
        if (!en) throw new Error('respuesta vacía');
        return payload.reply;
      } catch (err) {
        console.warn(`[Abu] intento ${intento + 1}:`, err?.name === 'AbortError' ? 'tardó demasiado' : (err?.message || err));
        if (intento < reintentos) await new Promise(r => setTimeout(r, 500));
      } finally {
        clearTimeout(timer);
      }
    }
    return null;
  }

  /*
    Diagnóstico rápido. Abre la consola del navegador (F12) y escribe:
        await pingAbu()
    Te dice si la clave de DeepSeek existe, si responde y en cuántos ms.
  */
  window.pingAbu = async function () {
    const { data: { session } } = await dbClient.auth.getSession();
    const r = await fetch(`${SUPABASE_URL}/functions/v1/generar-dialogo`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${session?.access_token || SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ mode: 'ping' })
    });
    const j = await r.json().catch(() => ({ error: 'respuesta no JSON', status: r.status }));
    console.log(j.ok ? '✅ Abu responde bien:' : '❌ Abu no responde:', j);
    return j;
  };

  /* ------------------------------------------------------------
     GUION LOCAL DE ABU
     Se usa cuando la Edge Function no contesta (sin conexión, API
     caída o clave vencida). Antes soltaba frases sueltas y repetía
     "¿te gusta 'we'?", que además no tiene sentido con pronombres.
     Ahora es una conversación de verdad: reacciona a lo que escribió
     el estudiante, nunca repite pregunta y cada 3 turnos le pide usar
     una palabra del grupo en una frase.
  ------------------------------------------------------------ */
  const ABU_GUION = [
    { id: 'today',   en: "What did you do today?",             es: "¿Qué hiciste hoy?",                       tips: ['I worked.', 'I studied English.', 'Nothing special 😅'] },
    { id: 'family',  en: "Who do you live with?",              es: "¿Con quién vives?",                       tips: ['With my family.', 'I live alone.', 'With my friends.'] },
    { id: 'work',    en: "Do you work or study?",              es: "¿Trabajas o estudias?",                   tips: ['I work.', 'I study.', 'Both! 😅'] },
    { id: 'food',    en: "What food do you like?",             es: "¿Qué comida te gusta?",                   tips: ['I like pizza.', 'Rice and chicken.', 'Everything! 😄'] },
    { id: 'weekend', en: "What do you do on weekends?",        es: "¿Qué haces los fines de semana?",         tips: ['I rest at home.', 'I go out.', 'I see my family.'] },
    { id: 'city',    en: "Where are you from?",                es: "¿De dónde eres?",                         tips: ["I'm from Colombia.", 'From Bogotá.', 'A small town.'] },
    { id: 'why',     en: "Why do you learn English?",          es: "¿Por qué aprendes inglés?",               tips: ['For my job.', 'To travel ✈️', 'I like it.'] },
    { id: 'music',   en: "What music do you listen to?",       es: "¿Qué música escuchas?",                   tips: ['I like rock.', 'Reggaeton 🔥', 'All kinds.'] },
    { id: 'travel',  en: "Where do you want to travel?",       es: "¿A dónde quieres viajar?",                tips: ['To the USA.', 'To Europe.', 'Anywhere! 😄'] },
    { id: 'morning', en: "What time do you wake up?",          es: "¿A qué hora te levantas?",                tips: ['At six.', 'Very early 😴', 'Late on Sundays.'] },
    { id: 'pet',     en: "Do you have a pet?",                 es: "¿Tienes mascota?",                        tips: ['Yes, a dog 🐶', "No, I don't.", 'I want one!'] },
    { id: 'movie',   en: "What was the last movie you saw?",   es: "¿Cuál fue la última película que viste?", tips: ['A comedy.', "I don't remember 😅", 'A horror movie.'] },
    { id: 'friend',  en: "Tell me about your best friend.",    es: "Cuéntame de tu mejor amigo.",             tips: ['He is funny.', 'She is very kind.', 'We study together.'] },
    { id: 'dream',   en: "What is your dream job?",            es: "¿Cuál es el trabajo de tus sueños?",      tips: ['A doctor.', "I don't know yet.", 'Something with computers.'] },
    { id: 'plans',   en: "What are your plans for tomorrow?",  es: "¿Qué planes tienes para mañana?",         tips: ['I work.', 'I rest.', 'I study English.'] }
  ];

  const alAzar = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ------------------------------------------------------------
     CORRECTOR LOCAL ✏️
     Garantiza que SIEMPRE haya corrección cuando el estudiante
     comete un error típico, aunque la Edge Function no responda
     (la IA corrige mejor, pero esto es la red de seguridad).
     Se muestra en la cajita ámbar "✏️" de la burbuja de Abu.
  ------------------------------------------------------------ */
  const CORRECCIONES_LOCALES = [
    { re: /\bi\s+(is|are)\b/i,                         fix: 'Se dice "I am", no "I is / I are".' },
    { re: /\bi\s+has\b/i,                              fix: 'Se dice "I have", no "I has".' },
    { re: /\b(he|she|it)\s+have\b/i,                   fix: 'Con he/she/it es "has", no "have".' },
    { re: /\b(he|she|it)\s+don'?t\b/i,                 fix: 'Con he/she/it es "doesn\'t", no "don\'t".' },
    { re: /\bi\s+am\s+agree\b/i,                       fix: 'Se dice "I agree" (sin "am").' },
    { re: /\bpeoples\b/i,                              fix: '"People" ya es plural: no lleva "s".' },
    { re: /\bmore\s+(better|worse|bigger|easier|faster)\b/i, fix: 'El comparativo va solo: "better", "bigger"... sin "more".' },
    { re: /\bfor\s+to\s+[a-z]/i,                       fix: 'Se dice "to + verbo", no "for to".' },
    { re: /\bdont\b/i,                                 fix: 'No olvides el apóstrofo: "don\'t".' },
    { re: /\bcant\b/i,                                 fix: 'No olvides el apóstrofo: "can\'t".' },
    { re: /\bdoesnt\b/i,                               fix: 'No olvides el apóstrofo: "doesn\'t".' },
    { re: /\bim\b/i,                                   fix: 'Se escribe "I\'m" (mayúscula y apóstrofo).' },
    { re: /(^|\s)i(\s|[,.!?]|$)/,                      fix: 'El pronombre "I" siempre va en mayúscula.' },
    { re: /\b(que|pero|porque|hola|gracias|bueno|entonces|también|tambien|estoy|tengo)\b/i, fix: 'Vi palabras en español: intenta escribirlo todo en inglés 😉' }
  ];
  function corregirLocal(texto) {
    const t = (texto || '').trim();
    if (!t) return '';
    const errores = [];
    for (const c of CORRECCIONES_LOCALES) {
      if (c.re.test(t)) errores.push(c.fix);
      if (errores.length >= 2) break;   // máximo 2 para no abrumar
    }
    return errores.join(' ');
  }

  // Reacción corta a lo último que escribió el estudiante (así se siente escuchado)
  function reaccionAbu(texto, usadas) {
    const t = (texto || '').toLowerCase().trim();
    if (usadas && usadas.length) return { en: `Perfect use of "${usadas[0]}"! 🎯`, es: `¡Perfecto uso de "${usadas[0]}"! 🎯` };
    if (/don'?t know|no s[eé]|idk|ni idea/.test(t))     return { en: 'No problem! 😄', es: '¡No pasa nada! 😄' };
    if (/hard|difficult|dif[ií]cil/.test(t))            return { en: "I know, but you're doing great! 💪", es: '¡Lo sé, pero lo haces muy bien! 💪' };
    if (/easy|f[aá]cil/.test(t))                        return { en: 'That’s the spirit! 🔥', es: '¡Ese es el ánimo! 🔥' };
    if (/^(yes|yeah|yep|sure|of course)/.test(t))       return { en: 'Great! 😄', es: '¡Genial! 😄' };
    if (/^(no|nope|not really|never)/.test(t))          return { en: 'Okay! 👌', es: '¡Está bien! 👌' };
    if (t.split(/\s+/).length >= 6)                     return { en: 'Wow, great sentence! 🔥', es: '¡Wow, gran frase! 🔥' };
    return alAzar([
      { en: 'Nice!', es: '¡Bien!' }, { en: 'Cool!', es: '¡Genial!' },
      { en: 'Love it!', es: '¡Me encanta!' }, { en: 'So good!', es: '¡Muy bien!' },
      { en: 'Awesome!', es: '¡Excelente!' }
    ]);
  }

  function abuFallback(textoUsuario = '', usadas = []) {
    const cs = chatSession;
    if (cs && !cs.guionUsado) cs.guionUsado = new Set();
    const hechas = cs?.guionUsado || new Set();
    const turno = cs?.count || 0;
    const r = reaccionAbu(textoUsuario, usadas);

    // Último mensaje: despedida, sin preguntas
    if (cs && turno >= cs.goal) {
      return {
        en: `${r.en} You did an amazing job today. See you soon! 👋`,
        es: `${r.es} Hiciste un trabajo increíble hoy. ¡Nos vemos pronto! 👋`,
        tips: ['Thank you! 😄', 'See you, Abu!', 'Bye bye 👋']
      };
    }

    /*
      Ya NO se le "ordena" al estudiante hacer una frase suelta
      ("Try a sentence with X 👀"): eso rompía el hilo de la charla.
      Ahora, cada 2 turnos, ABU MISMO usa una palabra pendiente dentro
      de una frase natural y hace una pregunta relacionada, invitando
      (no obligando) a responder con esa misma palabra. Las sugerencias
      rápidas incluyen una respuesta lista que la usa, para que el flujo
      de la conversación tenga sentido lógico.
    */
    if (cs && !cs.retadas) cs.retadas = new Set();
    const retadas = cs?.retadas || new Set();
    const sinUsar = chatWords.filter(w => !cs?.used.has(norm(w)));
    const libre = sinUsar.find(w => !retadas.has(norm(w))) || sinUsar[0];
    if (libre && turno > 0 && turno % 2 === 0) {
      retadas.add(norm(libre));
      const charla = alAzar([
        { en: `You know, I think learning English is never "${libre}" — it always surprises me 😄. What about you: is English "${libre}" for you?`,
          es: `¿Sabes? Creo que aprender inglés nunca es "${libre}", siempre me sorprende 😄. ¿Y tú? ¿El inglés es "${libre}" para ti?`,
          tips: [`Yes, it's very "${libre}" for me.`, `No, it's not "${libre}" at all.`, `Sometimes it feels "${libre}" 😅`] },
        { en: `Today my coffee was really "${libre}" ☕😄. Can you describe something in your day with the word "${libre}"?`,
          es: `Hoy mi café estuvo muy "${libre}" ☕😄. ¿Puedes describir algo de tu día con la palabra "${libre}"?`,
          tips: [`My morning was "${libre}".`, `My work is "${libre}" today.`, `Nothing "${libre}" today 😅`] },
        { en: `I love the word "${libre}" — I use it a lot when I talk about my week. How was your week? You can use "${libre}" in your answer 😉`,
          es: `Me encanta la palabra "${libre}", la uso mucho cuando hablo de mi semana. ¿Cómo estuvo tu semana? Puedes usar "${libre}" en tu respuesta 😉`,
          tips: [`My week was "${libre}"!`, `It was good, and very "${libre}".`, `A "${libre}" week, honestly.`] }
      ]);
      return {
        en: `${r.en} ${charla.en}`,
        es: `${r.es} ${charla.es}`,
        tips: charla.tips
      };
    }

    // Siguiente pregunta del guion que todavía no se haya hecho.
    // Una de las sugerencias siempre trae una palabra pendiente ya integrada.
    const pendientes = ABU_GUION.filter(q => !hechas.has(q.id));
    const sig = pendientes.length ? alAzar(pendientes) : ABU_GUION[turno % ABU_GUION.length];
    hechas.add(sig.id);
    const tips = [...sig.tips];
    if (libre) tips[tips.length - 1] = `It was "${libre}", I think 😄`;
    return { en: `${r.en} ${sig.en}`, es: `${r.es} ${sig.es}`, tips };
  }

  /*
    Respuestas sugeridas. Lo ideal viene de Abu (campo "tips"), pero si no
    llega se arman aquí leyendo qué tipo de pregunta hizo: así siempre hay
    algo que responder aunque falle la red.
  */
  function sugerenciasLocales(textoAbu) {
    const t = (textoAbu || '').toLowerCase();
    const libre = chatWords.filter(w => !chatSession?.used.has(norm(w)))[0];
    let base;
    // Las preguntas con wh- mandan sobre las de sí/no: "Why do you...?" no se
    // responde con "Yes, I do", aunque contenga "do you".
    if (/how are you|how do you feel|how is it going/.test(t))  base = ["I'm good! 😄", "A little tired.", "Great, thanks!"];
    else if (/\bwhy\b/.test(t))                            base = ['Because I like it.', "I don't know 😅", "It's fun!"];
    else if (/\bwhere\b/.test(t))                          base = ['At home.', 'In my city.', 'At school.'];
    else if (/\bwhen|what time\b/.test(t))                 base = ['Every day.', 'On weekends.', 'In the morning.'];
    else if (/\bhow (many|much|often|long)\b/.test(t))     base = ['Two or three.', 'A lot!', 'Not much.'];
    else if (/\bhow\b/.test(t))                            base = ['With my phone.', "It's easy!", "It's hard 😅"];
    else if (/\bwho\b/.test(t))                            base = ['My family.', 'My best friend.', 'My teacher.'];
    else if (/\bwhich\b/.test(t))                          base = ['The first one.', 'Both! 😄', "I'm not sure 🤔"];
    else if (/\bwhat.*(like|favou?rite|prefer)\b/.test(t)) base = ['I like it a lot.', 'Not really.', 'My favourite! 🔥'];
    else if (/\bwhat\b/.test(t))                           base = ['I like it.', "I'm not sure 🤔", 'Tell me more.'];
    else if (/\b(do|did|does|are|is|was|can|have|had|would|will) you\b/.test(t)) base = ['Yes, I do! 😄', "No, I don't.", 'Sometimes.'];
    else                                                    base = ['Yes! 😄', 'Really?', 'Tell me more.'];
    // Una sugerencia siempre es una FRASE COMPLETA que usa una palabra
    // pendiente del grupo, con sentido dentro de la conversación
    // (antes era "What about X?", que no la usaba de verdad).
    if (libre) {
      const conPalabra = alAzar([
        `For me, it's "${libre}".`,
        `I think it was "${libre}".`,
        `Honestly, quite "${libre}" 😄`
      ]);
      base = [...base.slice(0, 2), conPalabra];
    }
    return base;
  }

  function pintarSugerencias(tips) {
    const cont = document.getElementById('chat-quick');
    if (!cont) return;
    const lista = (Array.isArray(tips) ? tips : [])
      .map(t => String(t || '').trim()).filter(Boolean).slice(0, 3);
    const finales = lista.length >= 2 ? lista : sugerenciasLocales(tips);
    cont.innerHTML = finales.map(r =>
      `<button class="quick-reply shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 hover:bg-orange-50 hover:text-[#FF7A00] transition" data-txt="${escapeHTML(r)}">${escapeHTML(r)}</button>`
    ).join('');
    const input = document.getElementById('ai-input');
    cont.querySelectorAll('.quick-reply').forEach(b => {
      b.onclick = () => { if (input) { input.value = b.dataset.txt || ''; input.focus(); } };
    });
  }

  /* ---------- Pantalla de la charla ---------- */
  async function startChatPractice(nivel, group, cuenta) {
    closeModal();
    stopSpeaking();
    const g = (group && flujo.niveles[nivel]?.grupos?.[group]) || null;
    chatWords = await getChatWords(nivel, group, 10);
    aiChat = [];
    chatSession = {
      nivel, group, counts: !!cuenta, goal: CHAT_GOAL,
      count: (cuenta && g?.chat?.count) ? g.chat.count : 0,
      used: new Set(), streak: 0
    };

    const chips = chatWords.map(w =>
      `<span class="word-chip shrink-0 text-[11px] font-bold px-2 py-1 rounded-full bg-white border border-slate-200 text-slate-500" data-word="${escapeHTML(norm(w))}">${escapeHTML(w)}</span>`
    ).join('');

    appContainer.innerHTML = `
      <div class="card-3d p-3 sm:p-4 animate-pop mt-1">

        <div class="flex items-center gap-2 mb-1.5">
          <span class="bg-purple-100 text-purple-600 px-2.5 py-1 rounded-full text-[11px] font-bold uppercase shrink-0">💬 Abu</span>
          <div class="flex-1 progress-track" style="margin-top:0"><div id="chat-bar" class="progress-fill" style="width:${(chatSession.count / CHAT_GOAL) * 100}%"></div></div>
          <span class="text-[11px] font-black text-slate-400 shrink-0"><span id="chat-count" class="text-[#FF7A00]">${chatSession.count}</span>/${CHAT_GOAL}</span>
          <button id="chat-exit" title="Salir" class="shrink-0 w-6 h-6 rounded-full text-slate-300 hover:text-slate-500 hover:bg-slate-100 transition text-sm">&times;</button>
        </div>

        <div id="ai-messages" class="chat-scroll h-[46vh] min-h-[220px] overflow-y-auto p-2 space-y-2 mb-2 bg-slate-50 rounded-xl border border-slate-100"></div>

        <div id="chat-quick" class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-2 min-h-[26px]"></div>

        <div class="flex gap-2">
          <input id="ai-input" type="text" placeholder="Escribe en inglés..." autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send"
            class="flex-1 min-w-0 bg-white border-2 border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-[#FF7A00] text-slate-700 font-medium">
          <button id="ai-send" class="btn-juice bg-[#FF7A00] text-white font-bold px-4 py-2 rounded-xl shrink-0"><i class="fas fa-paper-plane"></i></button>
        </div>

        ${chips ? `
        <div class="flex items-center gap-2 mt-2">
          <div id="chat-chips" class="no-bar flex-1 flex gap-1.5 overflow-x-auto whitespace-nowrap py-0.5">${chips}</div>
          <span class="text-[10px] font-bold text-slate-400 shrink-0"><span id="chat-usadas">0</span>/${chatWords.length}</span>
        </div>` : ''}
      </div>`;

    bindChatPractice();
    pintarProgresoChat();

    // Abu empieza DE UNA VEZ con una pregunta directa (sin discurso largo).
    // La instrucción de usar las palabras va en un toast breve, no en el mensaje.
    let saludo;
    if (chatWords.length) {
      const q = alAzar(ABU_GUION);
      chatSession.guionUsado = new Set([q.id]);
      saludo = { en: `Hi! I'm Abu 👋 ${q.en}`, es: `¡Hola! Soy Abu 👋 ${q.es}`, tips: q.tips };
      setTimeout(() => showToast('💡 Usa las palabras de abajo en tus respuestas: dan puntos extra.'), 800);
    } else {
      saludo = { en: `Hi! I'm Abu 👋 How are you today?`, es: `¡Hola! Soy Abu 👋 ¿Cómo estás hoy?` };
    }
    addChatBubble('ai', saludo);
    aiChat.push({ role: 'assistant', content: saludo.en });
    pintarSugerencias(saludo.tips || saludo.en);   // sugerencias acordes al saludo
    speak(saludo.en);
  }

  function addChatBubble(role, msg) {
    const box = document.getElementById('ai-messages');
    if (!box) return null;
    const div = document.createElement('div');
    if (role === 'user') {
      div.className = 'flex justify-end';
      div.innerHTML = `<div class="bg-[#FF7A00] text-white rounded-2xl rounded-br-sm px-3.5 py-2 max-w-[85%] font-medium">${escapeHTML(msg.en)}</div>`;
    } else {
      div.className = 'flex justify-start items-end gap-1.5';
      div.innerHTML = `
        <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2 max-w-[78%] shadow-sm">
          <div class="font-medium leading-snug">${escapeHTML(msg.en)}</div>
          ${msg.es ? `<div class="text-xs text-slate-400 mt-0.5 leading-snug">${escapeHTML(msg.es)}</div>` : ''}
          ${msg.fix ? `<div class="mt-1.5 text-[11px] font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1 leading-snug">✏️ ${escapeHTML(msg.fix)}</div>` : ''}
        </div>
        <button data-say="${encodeURIComponent(msg.en || '')}" title="Escuchar otra vez"
          class="say-btn shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-[#FF7A00] hover:border-[#FF7A00] active:scale-90 transition flex items-center justify-center">
          <i class="fas fa-volume-up text-[11px]"></i>
        </button>`;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  // Marca las palabras objetivo usadas por primera vez y las devuelve.
  function marcarPalabrasUsadas(text) {
    if (!chatSession) return [];
    const t = ' ' + norm(text).replace(/\s+/g, ' ') + ' ';
    const nuevas = [];
    chatWords.forEach(w => {
      const k = norm(w);
      if (!k || chatSession.used.has(k)) return;
      if (t.includes(' ' + k + ' ')) {
        chatSession.used.add(k);
        nuevas.push(w);
        document.querySelectorAll('#chat-chips .word-chip').forEach(ch => {
          if (ch.dataset.word === k) ch.classList.add('used');
        });
      }
    });
    const cont = document.getElementById('chat-usadas');
    if (cont) cont.textContent = chatSession.used.size;
    return nuevas;
  }

  function pintarProgresoChat() {
    const cs = chatSession;
    if (!cs) return;
    const pct = Math.min(100, (cs.count / cs.goal) * 100);
    const bar = document.getElementById('chat-bar'); if (bar) bar.style.width = pct + '%';
    const num = document.getElementById('chat-count'); if (num) num.textContent = cs.count;
    updateProgressBar(pct);
  }

  function bindChatPractice() {
    const box = document.getElementById('ai-messages');
    const input = document.getElementById('ai-input');
    const send = document.getElementById('ai-send');
    if (!input || !send || !box) return;

    // Volver a escuchar cualquier mensaje de Abu
    box.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]');
      if (!b) return;
      stopSpeaking();
      speak(decodeURIComponent(b.dataset.say || ''));
    });

    const exit = document.getElementById('chat-exit');
    if (exit) exit.onclick = async () => {
      const cs = chatSession;
      stopSpeaking();
      if (cs?.counts && cs.group && flujo.niveles[cs.nivel]?.grupos?.[cs.group]) {
        flujo.niveles[cs.nivel].grupos[cs.group].chat.count = cs.count;   // se guarda el avance
        await updateUserFlow();
        showToast(`💬 Guardamos tu avance: ${cs.count}/${CHAT_GOAL} mensajes.`);
      }
      chatSession = null;
      runFlow();
    };

    const enviar = async (textoDirecto) => {
      const text = (textoDirecto ?? input.value ?? '').toString().trim();
      if (!text || send.disabled || !chatSession) return;
      input.value = '';
      addChatBubble('user', { en: text });
      aiChat.push({ role: 'user', content: text });

      /* ---- Recompensa inmediata (así el chat engancha) ---- */
      const cs = chatSession;
      cs.count++;
      cs.streak++;
      let pts = 3;
      const nuevas = marcarPalabrasUsadas(text);
      const fixLocal = corregirLocal(text);   // red de seguridad de correcciones
      if (nuevas.length) pts += 6 * nuevas.length;
      if (text.split(/\s+/).length >= 6) pts += 2;      // premio a frases largas
      pintarProgresoChat();

      // El avance del chat se guarda EN CADA MENSAJE (antes solo al salir con la X:
      // si recargabas a mitad de charla, el contador volvía a cero).
      if (cs.counts && cs.group && flujo.niveles[cs.nivel]?.grupos?.[cs.group]) {
        flujo.niveles[cs.nivel].grupos[cs.group].chat.count = cs.count;
      }
      await updateUserFlow();
      await addPoints(pts);
      touchStreak();
      if (nuevas.length) showToast(`🎯 ¡Usaste "${nuevas[0]}"! +${6 * nuevas.length} puntos`);
      else if (cs.count === Math.ceil(cs.goal / 2)) { triggerConfetti(); showToast('🔥 ¡Mitad del camino! Vas encendido.'); }
      else if (cs.goal - cs.count === 3) showToast('💪 ¡Solo 3 mensajes más!');

      const quick = document.getElementById('chat-quick');
      if (quick) quick.innerHTML = '';

      const typing = document.createElement('div');
      typing.className = 'flex justify-start';
      typing.innerHTML = `<div class="bg-white border border-slate-200 text-slate-400 rounded-2xl rounded-bl-sm px-3.5 py-2 text-sm"><i class="fas fa-circle-notch fa-spin mr-1"></i> Abu escribe...</div>`;
      box.appendChild(typing);
      box.scrollTop = box.scrollHeight;
      send.disabled = true;

      let reply = await callChatFunction({
        mode: 'chat',
        nivel: chatSession?.nivel || flujo.currentNivel,
        messages: aiChat.slice(-8),           // contexto suficiente para que la charla tenga hilo
        words: chatWords.slice(0, 8),
        used: [...cs.used],                    // palabras ya usadas → la IA se enfoca en las pendientes
        turn: cs.count,                        // Abu sabe si está empezando o cerrando
        goal: cs.goal
      });
      typing.remove();
      if (!reply) {
        reply = abuFallback(text, nuevas);
        // Aviso único: si sale, la Edge Function no está respondiendo.
        if (!chatModoLocalAvisado) {
          chatModoLocalAvisado = true;
          console.warn('[Abu] sin respuesta de la Edge Function → guion local. Revisa los logs de generar-dialogo en Supabase.');
          showToast('📴 Abu está respondiendo en modo básico.', 2600);
        }
      }

      // Corrección garantizada: si la IA no marcó nada pero el corrector
      // local detectó un error, se muestra igual la cajita ✏️.
      if (!reply.fix && fixLocal) reply.fix = fixLocal;

      addChatBubble('ai', { en: reply.en, es: reply.es || '', fix: reply.fix || '' });
      aiChat.push({ role: 'assistant', content: reply.en });
      pintarSugerencias(reply.tips && reply.tips.length ? reply.tips : reply.en);
      stopSpeaking();
      speak(reply.en);
      send.disabled = false;
      input.focus();

      if (chatSession && chatSession.count >= chatSession.goal) setTimeout(finishChatPractice, 1100);
    };

    send.onclick = () => enviar();
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviar(); else sfx('type'); });
    setTimeout(() => input.focus(), 120);
  }

  async function finishChatPractice() {
    const cs = chatSession;
    if (!cs) return;
    chatSession = null;
    stopSpeaking();
    await addPoints(25);

    const g = (cs.group && flujo.niveles[cs.nivel]?.grupos?.[cs.group]) || null;
    if (cs.counts && g) {
      g.chat = { done: true, count: cs.count };
      g.completed = true;
      flujo.stats.sessionsCompleted = (flujo.stats.sessionsCompleted || 0) + 1;
      await updateUserFlow();
      return groupCompleteScreen(cs.nivel, cs.group, g);
    }
    playSound('complete'); triggerConfetti();
    showModal({
      icon: '💬', title: '¡Conversación completada!',
      body: `Enviaste <b>${cs.count} mensajes</b> y usaste <b class="text-green-600">${cs.used.size}</b> de tus palabras. <br><span class="text-yellow-600 font-bold">+25 puntos</span>`,
      dismissable: false,
      actions: [{ label: 'Continuar', onClick: () => { closeModal(); runFlow(); } }]
    });
  }

  async function renderProgresoNivel(nivel) {
    const el = document.getElementById('pg-body');
    if (!el) return;
    el.innerHTML = spinnerHTML();

    const conContenido = await getNiveles();
    const niveles = sortNiveles([...new Set([...NIVELES_FIJOS, ...conContenido])]);

    let { data } = await dbClient.from('palabras').select('id').eq('nivel', nivel).range(0, 9999);
    if (!(data || []).length) ({ data } = await dbClient.from('palabras').select('id').ilike('nivel', nivel).range(0, 9999));
    const ids = (data || []).map(r => String(r.id));

    const total = ids.length;
    const estudiadas = ids.filter(id => flujo.srs[id]).length;
    const dominadas = ids.filter(id => flujo.srs[id] && flujo.srs[id].learned).length;
    const ahora = Date.now();
    const pendientes = ids.filter(id => { const s = flujo.srs[id]; return s && !s.learned && s.due && new Date(s.due).getTime() <= ahora; }).length;
    const pctDom = total ? Math.round((dominadas / total) * 100) : 0;
    const pctEst = total ? Math.round((estudiadas / total) * 100) : 0;

    const grupos = await getGroups(nivel);
    const gCompletos = grupos.filter(g => flujo.niveles[nivel]?.grupos?.[g]?.completed).length;

    const chips = niveles.map(n => `
      <button class="pg-chip btn-juice ${n === nivel ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-600'} font-black text-sm px-4 py-2 rounded-xl" data-nivel="${n}">${n}</button>`).join('');

    el.innerHTML = `
      <div class="flex flex-wrap justify-center gap-2 mb-4">${chips}</div>
      ${total === 0 ? `<p class="text-slate-400 text-center py-4">El nivel <b>${nivel}</b> no tiene palabras cargadas todavía. 📭</p>` : `
      <div class="grid grid-cols-2 gap-2 mb-4">

        <div class="bg-blue-50 rounded-xl p-3 text-center"><div class="text-2xl font-black text-blue-600">${estudiadas}</div><div class="text-[10px] font-bold text-slate-400 uppercase">Ya estudiadas</div></div>
        <div class="bg-green-50 rounded-xl p-3 text-center"><div class="text-2xl font-black text-green-600">${dominadas}</div><div class="text-[10px] font-bold text-slate-400 uppercase">Dominadas 🏅</div></div>
        <div class="bg-orange-50 rounded-xl p-3 text-center"><div class="text-2xl font-black text-[#FF7A00]">${pendientes}</div><div class="text-[10px] font-bold text-slate-400 uppercase">Por repasar hoy</div></div>
      </div>
      <div class="mb-3">
        <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>DOMINADAS</span><span>${pctDom}% · te falta ${100 - pctDom}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pctDom}%"></div></div>
      </div>
      <div class="mb-3">
        <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>ESTUDIADAS</span><span>${pctEst}% · te falta ${100 - pctEst}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pctEst}%; background: linear-gradient(90deg,#3b82f6,#60a5fa);"></div></div>
      </div>
      <p class="text-center text-sm text-slate-500">Grupos completados: <b class="text-slate-700">${gCompletos} / ${grupos.length}</b> 📚 · Racha: <b class="text-orange-500">${flujo.racha?.days || 0} día(s)</b> 🔥</p>`}`;

    el.querySelectorAll('.pg-chip').forEach(b => { b.onclick = () => renderProgresoNivel(b.dataset.nivel); });

  /* ---------- Certificados ----------
     Un certificado se desbloquea cuando TODAS las palabras del nivel
     están DOMINADAS (flujo.srs[id].learned === true). El modal muestra
     nivel por nivel cuántas palabras faltan y, cuando llegas al 100 %,
     habilita el botón para pedirlo por WhatsApp.                       */
  let certDisponibles = 0;

  async function getCertProgreso(nivel) {
    let { data } = await dbClient.from('palabras').select('id').eq('nivel', nivel).range(0, 9999);
    if (!(data || []).length) ({ data } = await dbClient.from('palabras').select('id').ilike('nivel', nivel).range(0, 9999));
    const ids = (data || []).map(r => String(r.id));
    const total = ids.length;
    const dominadas = ids.filter(id => flujo.srs[id] && flujo.srs[id].learned).length;
    return {
      nivel, total, dominadas,
      faltan: Math.max(0, total - dominadas),
      pct: total ? Math.round((dominadas / total) * 100) : 0,
      listo: total > 0 && dominadas >= total
    };
  }

  function certWhatsAppURL(nivel) {
    const nombre = (userProfile?.full_name || '').trim();

  /* ============================================================
     13.6. MAZO — tu propio grupo de palabras, guardado en Supabase
     ------------------------------------------------------------
     · Las palabras viven en la tabla "mazo" (una fila por palabra,
       enlazada a "palabras" por word_id).
     · El avance vive en la tabla "mazo_flujo" (JSON), igual que
       "flujo" en profiles: puedes salirte y retomar donde ibas.
     · El Excel solo hace falta la primera vez. Después basta la M.
  ============================================================ */
  let mazoSession = null;
  let mazoCount = 0;

  // ---------- Lectura del mazo ----------
  async function cargarMazo() {
    const { data: filas, error } = await dbClient.from('mazo')
      .select('id, ingles, espanol, word_id')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });
    if (error) { console.error('[mazo] no se pudo leer:', error.message); return { error, filas: [], words: [] }; }

    const ids = (filas || []).filter(f => f.word_id).map(f => f.word_id);
    let words = [];
    if (ids.length) {
      const { data } = await dbClient.from('palabras').select('*').in('id', ids);
      words = data || [];
    }

    // Mazos guardados antes de existir word_id: se buscan por nombre y se reparan solos.
    const sinId = (filas || []).filter(f => !f.word_id);
    if (sinId.length) {
      const halladas = await buscarPalabrasMazo(sinId.map(f => f.ingles));
      sinId.forEach(f => {
        const w = halladas.find(x => (x.ingles || '').toLowerCase() === (f.ingles || '').toLowerCase());
        if (w) {
          words.push(w);
          dbClient.from('mazo').update({ word_id: w.id }).eq('id', f.id).then(() => {});
        }
      });
    }

    // Mismo orden en que las cargó la persona
    const orden = new Map((filas || []).map((f, k) => [(f.ingles || '').toLowerCase(), k]));
    words.sort((a, b) => (orden.get((a.ingles || '').toLowerCase()) ?? 999) - (orden.get((b.ingles || '').toLowerCase()) ?? 999));
    return { filas: filas || [], words };
  }

  // Busca palabras del Excel en la tabla "palabras" (tolerante a mayúsculas).
  async function buscarPalabrasMazo(listaIngles) {
    const unicas = [...new Set(listaIngles.map(w => (w || '').toString().trim()).filter(Boolean))];
    if (!unicas.length) return [];
    const variantes = [...new Set(unicas.flatMap(w => [
      w, w.toLowerCase(), w.toUpperCase(),
      w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
    ]))];
    const { data, error } = await dbClient.from('palabras').select('*').in('ingles', variantes);
    if (error) { console.error('[mazo] error buscando palabras:', error.message); return []; }
    const vistos = new Set(); const out = [];
    (data || []).forEach(w => {
      const k = (w.ingles || '').toLowerCase();
      if (!vistos.has(k)) { vistos.add(k); out.push(w); }
    });
    return out;
  }

  // ---------- Flujo del mazo (tabla mazo_flujo) ----------
  async function leerMazoFlujo() {
    const { data, error } = await dbClient.from('mazo_flujo').select('flujo')
      .eq('user_id', currentUser.id).maybeSingle();
    if (error) { console.warn('[mazo] flujo:', error.message); return null; }
    return data?.flujo || null;
  }
  function estadoMazo() {
    const ms = mazoSession;
    if (!ms) return { pendiente: false };
    return {
      pendiente: true,
      phase: ms.phase,
      index: ms.index,
      correct: ms.correct,
      wrong: ms.wrong,
      ids: ms.words.map(w => w.id),
      queue: (ms.queue || []).map(q => ({ id: q.word.id, type: q.type })),
      total: ms.words.length,
      updated: new Date().toISOString()
    };
  }
  function guardarMazoFlujo() {
    if (!currentUser) return;
    dbClient.from('mazo_flujo')
      .upsert({ user_id: currentUser.id, flujo: estadoMazo(), updated_at: new Date().toISOString() }, { onConflict: 'user_id' })
      .then(({ error }) => { if (error) console.warn('[mazo] no se pudo guardar el avance:', error.message); });
  }
  async function limpiarMazoFlujo() {
    await dbClient.from('mazo_flujo').delete().eq('user_id', currentUser.id);
  }

  // ---------- Insignia del botón "M" ----------

    const b = document.getElementById('mazo-badge');

  // ---------- Botón "M": entra directo, sin Excel ----------
  async function abrirMazoRapido() {

  // ---------- Carga del Excel: AÑADE, no reemplaza ----------
  async function procesarExcelMazo(file) {
    const status = document.getElementById('mz-status');
    const setSt = (html) => { if (status) status.innerHTML = html; };
    if (!file) return;
    if (!window.XLSX) return setSt('⚠️ No se pudo cargar el lector de Excel. Revisa tu conexión y recarga.');

    try {
      setSt('⏳ Leyendo el archivo...');
      const wb = XLSX.read(await file.arrayBuffer());
      const hoja = wb.Sheets[wb.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, { defval: '' });
      if (!filas.length) return setSt('❌ El Excel está vacío.');

      const clave = Object.keys(filas[0]).find(k => k.trim().toLowerCase().replace(/é/g, 'e') === 'ingles');
      if (!clave) return setSt('❌ El Excel debe tener una columna llamada <b>ingles</b>.');

      const lista = filas.map(f => (f[clave] || '').toString().trim()).filter(Boolean);
      if (!lista.length) return setSt('❌ La columna "ingles" está vacía.');

      setSt(`🔎 Buscando ${lista.length} palabra(s)...`);
      const halladas = await buscarPalabrasMazo(lista);
      if (!halladas.length) return setSt('❌ Ninguna de esas palabras existe en la base. Revisa la ortografía.');

      // Se añaden solo las que aún no están (el índice único de Supabase también lo impide)
      const { filas: yaGuardadas } = await cargarMazo();
      const existentes = new Set(yaGuardadas.map(f => (f.ingles || '').toLowerCase()));
      const nuevas = halladas.filter(w => !existentes.has((w.ingles || '').toLowerCase()));

      if (nuevas.length) {
        const { error: insErr } = await dbClient.from('mazo').insert(
          nuevas.map(w => ({ user_id: currentUser.id, ingles: w.ingles, espanol: w.espanol, word_id: w.id }))
        );
        if (insErr) {
          console.error('[mazo] insert:', insErr);
          return setSt('❌ No se pudo guardar: ' + escapeHTML(insErr.message) +
            '<br><span class="font-normal">Ejecuta <b>abulingo-supabase.sql</b> en Supabase.</span>');
        }
      }

      const repetidas = halladas.length - nuevas.length;
      const faltantes = lista.filter(l => !halladas.some(w => (w.ingles || '').toLowerCase() === l.toLowerCase()));
      await refreshMazoBadge();

      setSt(`✅ <b>${nuevas.length}</b> palabra(s) añadidas a tu mazo` +
        (repetidas ? ` · <span class="text-slate-400">${repetidas} ya estaban</span>` : '') +
        (faltantes.length ? ` · <span class="text-slate-400">${faltantes.length} no existen en la base</span>` : ''));

      const cont = document.getElementById('mz-actions');
      const { words } = await cargarMazo();
      if (cont) {
        cont.innerHTML = `
          <button id="mz-ahora" class="btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl w-full">🎯 Practicar ahora (${words.length})</button>
          <button id="mz-luego" class="mt-2 w-full text-xs font-bold text-slate-400 hover:text-slate-600">Guardar y estudiar después (botón M)</button>`;
        document.getElementById('mz-ahora').onclick = async () => { await limpiarMazoFlujo(); startMazoPractice(words); };
        document.getElementById('mz-luego').onclick = () => { closeModal(); showToast('🃏 Guardado. Toca la <b>M</b> cuando quieras estudiarlo.'); };
      }
    } catch (err) {
      console.error('[mazo] error leyendo el Excel:', err);
      setSt('❌ No se pudo leer el archivo. ¿Es un Excel válido (.xlsx, .xls o .csv)?');
    }
  }

  // ---------- Práctica del mazo (tarjetas → ejercicios) ----------
  function startMazoPractice(words, guardado = null) {
    closeModal();
    const lbl = document.getElementById('nivel-label');
    if (lbl) lbl.textContent = 'M';   // arriba se ve que estás en el mazo
    words.forEach(w => { groupCache.map[String(w.id)] = w; }); // para updateSRS e imágenes

    if (guardado && guardado.pendiente) {
      // Reanudar: mismo orden de palabras y misma cola de ejercicios
      const porId = new Map(words.map(w => [w.id, w]));
      const orden = (guardado.ids || []).map(id => porId.get(id)).filter(Boolean);
      const lista = orden.length ? orden : [...words];
      const pool = lista.map(w => w.ingles);
      const queue = (guardado.queue || [])
        .map(q => { const w = porId.get(q.id); return w ? { word: w, type: q.type,
          options: q.type === 'select_by_image' ? buildOptions(w.ingles, pool.length >= 4 ? pool : [w.ingles, 'yes', 'no', 'time']) : null } : null; })
        .filter(Boolean);
      mazoSession = {
        words: lista, phase: guardado.phase || 'review', index: guardado.index || 0,
        queue, correct: guardado.correct || 0, wrong: guardado.wrong || 0
      };
      showToast('🃏 Retomamos donde ibas.');
      return nextMazoStep();
    }

    mazoSession = { words: [...words].sort(() => Math.random() - 0.5), phase: 'review', index: 0, queue: [], correct: 0, wrong: 0 };
    guardarMazoFlujo();
    renderMessage('🃏', '¡Tu mazo personalizado!',
      `Vamos con <b>${words.length}</b> palabra(s) de tu mazo: primero tarjetas ✨ y luego ejercicios 👁️👂.<br>Su progreso también entra a tu memoria espaciada. 🧠<br><span class="text-xs text-slate-400">Si sales, retomas donde ibas.</span>`,
      '¡Empezar! 🚀', () => nextMazoStep());
  }

  async function nextMazoStep() {
    const ms = mazoSession;
    if (!ms) return runFlow();

    // Fase 1: tarjetas
    if (ms.phase === 'review') {
      if (ms.index >= ms.words.length) {
        ms.phase = 'practice'; ms.index = 0;
        const pool = ms.words.map(w => w.ingles);
        const opciones = (w) => buildOptions(w.ingles, pool.length >= 4 ? pool : [w.ingles, 'yes', 'no', 'time']);
        // También aquí: los dos ejercicios por palabra, para que puedan dominarse.
        const r1 = ms.words.filter(w => w.imagen).map(w => ({ word: w, type: 'select_by_image', options: opciones(w) }));
        const r2 = ms.words.map(w => ({ word: w, type: 'write_by_audio', options: null }));
        // Intercalado aleatorio 👁️/👂 (los dos ejercicios de una palabra no van pegados)
        ms.queue = mezclarEjercicios([...r1, ...r2]);
        guardarMazoFlujo();
        showEncouragement(() => nextMazoStep());
        return;
      }
      const w = ms.words[ms.index];
      updateProgressBar((ms.index / (ms.words.length * 2)) * 100);
      appContainer.innerHTML = flashcardHTML(w, ms.index + 1, ms.words.length);
      bindFlashcard(w, async (res) => {
        await updateSRS(w.id, res, { type: 'flashcard' });
        ms.index++;
        guardarMazoFlujo();
        nextMazoStep();
      });
      return;
    }

    // Fase 2: ejercicios
    if (ms.index >= ms.queue.length) {
      const c = ms.correct, f = ms.wrong, total = ms.words.length;
      mazoSession = null;
      await limpiarMazoFlujo();
      const lbl = document.getElementById('nivel-label');
      if (lbl) lbl.textContent = flujo.currentNivel;
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '🃏', title: '¡Mazo completado!',
        body: `<span class="text-green-600 font-bold">${c} aciertos</span> · <span class="text-slate-400">${f} fallos</span> de ${total} palabras.<br>Ya entraron a tu ciclo de memoria espaciada. 🧠`,
        dismissable: false,
        actions: [
          { label: 'Practicar de nuevo 🔁', onClick: async () => { closeModal(); const { words } = await cargarMazo(); startMazoPractice(words); } },
          { label: 'Volver a mis lecciones', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); runFlow(); } }
        ]
      });
      return;
    }

    const ex = ms.queue[ms.index];
    updateProgressBar(((ms.words.length + ms.index) / (ms.words.length + ms.queue.length)) * 100);
    const avanzar = async (ok, type) => {
      if (ok) ms.correct++; else ms.wrong++;
      await updateSRS(ex.word.id, ok ? 'practice_correct' : 'practice_wrong', { type });
      ms.index++;
      guardarMazoFlujo();
      setTimeout(() => nextMazoStep(), ok ? 1000 : 2000);
    };
    if (ex.type === 'select_by_image') renderSelectImage(ex.word, ex.options, (ok) => avanzar(ok, 'select_by_image'));
    else renderWriteAudio(ex.word, (ok) => avanzar(ok, 'write_by_audio'));
  }

  /* ============================================================
     14.9. CLUB DE CONVERSACIÓN  —  se dibuja en el <main>, no en modal
     ------------------------------------------------------------
     Cuatro pestañas:
       📅 Salas    → quedadas por Google Meet  (club_sesiones + club_participantes)
       🎭 Guiones  → conversaciones listas para actuar  (tabla "conversaciones")
       💬 Chat     → mensajes entre estudiantes        (club_mensajes)
       👥 En línea → quién está conectado ahora        (club_presencia)

     La tabla "conversaciones" ya existía: cada fila es un GUIÓN
     (titulo · conversacion · cantidad de papeles · nivel_ingles).
     El guion se parte por líneas "Rol: frase", se reparten los
     papeles como en una obra de teatro y el grupo se ve por Meet.

     El SQL de las tablas nuevas está en abulingo-club.sql.
  ============================================================ */
  const CLUB_MSG_MAX_LEN     = 400;   // largo máximo de un mensaje del chat
  const CLUB_MSG_POINTS      = 2;     // puntos por mensaje escrito en el club
  const CLUB_MSG_DAILY_MAX   = 10;    // mensajes que dan puntos al día
  const CLUB_JOIN_POINTS     = 10;    // puntos por apuntarte a una sala (1 vez al día)
  const CLUB_ONLINE_MIN      = 3;     // minutos para seguir contando como "en línea"
  const CLUB_LATIDO_MS       = 45000; // cada cuánto se refresca tu presencia
  const CLUB_TICK_MS         = 6000;  // cada cuánto se refresca la pestaña abierta
  const MEET_NUEVO_URL       = 'https://meet.google.com/new';

  let clubTab       = 'salas';     // 'salas' | 'guiones' | 'chat' | 'gente'
  let clubSala      = 'general';   // sala del chat: 'general' o un nivel
  let clubGuionOpen = null;        // id del guion que está desplegado
  let clubGuionRol  = {};          // { idGuion: 'rolElegido' } para resaltar tus frases
  let clubTimer     = null;
  let clubLatidoT   = null;
  let clubUltId     = 0;           // último id de mensaje pintado (para no re-scrollear)

  const clubActivo = () => !!document.getElementById('club-root');
  const miNivel    = () => flujo?.currentNivel || userProfile?.nivel || 'A1';
  const miNombre   = () => primerNombre(userProfile?.full_name, 'Estudiante');

  // "hace 2 min", "ayer 15:04"...
  function clubHora(iso) {
    if (!iso) return '';
    const d = new Date(iso), min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 1) return 'ahora';
    if (min < 60) return `hace ${min} min`;
    if (d.toDateString() === new Date().toDateString()) return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function clubCuando(iso) {
    if (!iso) return 'Sin hora fija';
    const d = new Date(iso);
    const hoy = d.toDateString() === new Date().toDateString();
    const txt = d.toLocaleString('es', { weekday: hoy ? undefined : 'short', day: hoy ? undefined : '2-digit', month: hoy ? undefined : 'short', hour: '2-digit', minute: '2-digit' });
    return (hoy ? 'Hoy ' : '') + txt;
  }
  const dtLocalValue = (d) => {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const nivelChip = (n, extra = '') =>
    `<span class="shrink-0 bg-orange-100 text-[#FF7A00] text-[10px] font-black px-2 py-0.5 rounded-full ${extra}">${escapeHTML(n || '—')}</span>`;
  const inicialHTML = (nombre) =>
    `<span class="shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-[#FF7A00] to-orange-600 text-white font-black flex items-center justify-center text-sm">${escapeHTML((nombre || '?').slice(0, 1).toUpperCase())}</span>`;

  // Mensaje de ayuda cuando falta una tabla o una política RLS.
  function clubErrorHTML(error, tabla) {
    return `<div class="text-center py-6">
      <p class="text-red-500 font-bold">No se pudo leer <b>${escapeHTML(tabla)}</b>.</p>
      <p class="text-slate-400 text-xs mt-2">${escapeHTML(error?.message || '')}</p>
      <p class="text-slate-400 text-xs mt-2">Ejecuta <b>abulingo-club.sql</b> en el editor SQL de Supabase: crea las tablas del Club y sus políticas RLS.</p>
    </div>`;
  }

  /* ---------- Guiones: "A: Hello" → papeles + frases ---------- */
  function parsearGuion(texto, cantidad) {
    const lineas = [], roles = [];
    (texto || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      // Un papel es corto y sin puntuación rara: "A:", "Ana:", "Shop assistant:"
      const m = l.match(/^([A-Za-zÁÉÍÓÚÑáéíóúñ0-9 .'-]{1,24}):\s*(.+)$/);
      if (m && m[1].trim().split(/\s+/).length <= 3) {
        const rol = m[1].trim();
        if (!roles.includes(rol)) roles.push(rol);
        lineas.push({ rol, texto: m[2].trim() });
      } else {
        lineas.push({ rol: null, texto: l });   // acotación / instrucción
      }
    });
    if (!roles.length) {
      const n = Math.max(2, parseInt(cantidad) || 2);
      for (let i = 0; i < n; i++) roles.push(`Papel ${String.fromCharCode(65 + i)}`);
    }
    return { roles, lineas };
  }

    }, { onConflict: 'user_id' });

    el.querySelectorAll('.cl-meet').forEach(b => b.onclick = () => {

        </div>
        <p class="text-[10px] text-slate-400 mb-2">Toca <b>Crear Meet</b>, copia el enlace que te dé Google y pégalo aquí. 🔗</p>

        <label class="text-[10px] font-black text-slate-400 uppercase">Nota para el grupo (opcional)</label>
        <input id="cs-notas" type="text" maxlength="140" placeholder="Ej: vamos despacio, principiantes bienvenidos"
          class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-3 py-2 mb-3 font-medium focus:outline-none focus:border-[#FF7A00]">

        <p id="cs-error" class="text-red-500 text-xs font-bold mb-2 hidden text-center"></p>

        <div class="flex gap-2">
          <button id="cs-cancelar" class="flex-1 bg-slate-100 text-slate-500 font-bold py-2.5 rounded-xl">Cancelar</button>
          <button id="cs-guardar" class="flex-1 btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl">Crear sala 🚀</button>
        </div>
      </div>`;

    const sel = document.getElementById('cs-conv');
    const titulo = document.getElementById('cs-titulo');
    const cupos = document.getElementById('cs-cupos');
    sel.onchange = () => {
      const op = sel.selectedOptions[0];
      if (!sel.value) return;
      titulo.value = op.dataset.titulo || '';
      cupos.value = op.dataset.cupos || 2;
      const conv = lista.find(c => String(c.id) === sel.value);
      if (conv) document.getElementById('cs-nivel').value = conv.nivel_ingles;
    };

    document.getElementById('cs-crear-meet').onclick = () => window.open(MEET_NUEVO_URL, '_blank', 'noopener');
    document.getElementById('cs-cancelar').onclick = () => { const b = document.getElementById('club-body'); if (b) b.dataset.tab = ''; renderClubSalas(); };
    document.getElementById('cs-guardar').onclick = async () => {
      const errEl = document.getElementById('cs-error');
      const setErr = (m) => { errEl.textContent = m; errEl.classList.remove('hidden'); };
      const t = (titulo.value || '').trim();
      const meet = (document.getElementById('cs-meet').value || '').trim();
      const fecha = document.getElementById('cs-fecha').value;
      const nCupos = parseInt(cupos.value) || 2;
      if (!t) return setErr('Ponle un título a tu sala.');
      if (nCupos < 2) return setErr('Una sala necesita al menos 2 cupos.');
      if (meet && !/^https?:\/\//i.test(meet)) return setErr('El enlace del Meet debe empezar por https://');

      const fila = {
        anfitrion_id: currentUser.id,
        anfitrion_nombre: miNombre(),
        conversacion_id: sel.value ? parseInt(sel.value) : null,
        titulo: t,
        nivel_ingles: document.getElementById('cs-nivel').value,
        cupos: nCupos,
        meet_url: meet || null,
        inicia_at: fecha ? new Date(fecha).toISOString() : null,
        notas: (document.getElementById('cs-notas').value || '').trim() || null,
        estado: 'abierta'
      };
      const { data, error } = await dbClient.from('club_sesiones').insert(fila).select().maybeSingle();
      if (error) return setErr('No se pudo crear: ' + error.message);

      // El anfitrión queda apuntado con el primer papel del guion.
      let rol = null;
      if (fila.conversacion_id) {
        const { data: c } = await dbClient.from('conversaciones').select('conversacion, cantidad').eq('id', fila.conversacion_id).maybeSingle();
        if (c) rol = parsearGuion(c.conversacion, c.cantidad).roles[0] || null;
      }
      await dbClient.from('club_participantes').insert({
        sesion_id: data.id, user_id: currentUser.id, nombre: miNombre(), nivel: miNivel(), rol
      });

      triggerConfetti();
      showToast('📅 ¡Sala creada! Comparte el enlace con el club.');
      const b = document.getElementById('club-body'); if (b) b.dataset.tab = '';
      renderClubSalas();
    };
  }

  async function clubUnirse(sesionId, convId) {
    const { data: s } = await dbClient.from('club_sesiones').select('cupos, titulo').eq('id', sesionId).maybeSingle();
    const { data: gente } = await dbClient.from('club_participantes').select('user_id, rol').eq('sesion_id', sesionId);
    const ocupados = gente || [];
    if (ocupados.some(p => p.user_id === currentUser.id)) return renderClubSalas();
    if (ocupados.length >= (s?.cupos || 2)) { showToast('😅 Alguien tomó el último cupo.'); return renderClubSalas(); }

    // Papel libre del guion (si la sala tiene uno).
    let rol = null;
    if (convId) {
      const { data: c } = await dbClient.from('conversaciones').select('conversacion, cantidad').eq('id', convId).maybeSingle();
      if (c) {
        const tomados = ocupados.map(p => p.rol).filter(Boolean);
        rol = parsearGuion(c.conversacion, c.cantidad).roles.find(r => !tomados.includes(r)) || null;
      }
    }
    const { error } = await dbClient.from('club_participantes')
      .insert({ sesion_id: sesionId, user_id: currentUser.id, nombre: miNombre(), nivel: miNivel(), rol });
    if (error) { showToast('⚠️ No se pudo entrar: ' + escapeHTML(error.message)); return; }

    ensureDaily();
    if ((flujo.daily.club.joins || 0) < 1) {
      flujo.daily.club.joins = 1;
      await updateUserFlow();
      await addPoints(CLUB_JOIN_POINTS);
    }
    triggerConfetti();
    showToast(rol ? `🎭 ¡Dentro! Tu papel es <b>${escapeHTML(rol)}</b>.` : '🙌 ¡Te apuntaste a la sala!');
    renderClubSalas();
  }

  async function clubSalirSala(sesionId) {
    await dbClient.from('club_participantes').delete().eq('sesion_id', sesionId).eq('user_id', currentUser.id);
    showToast('Saliste de la sala.');
    renderClubSalas();
  }

  async function clubCerrarSala(sesionId) {
    showModal({
      icon: '🔒', title: '¿Cerrar la sala?',
      body: 'Dejará de aparecer en la lista. Los que ya se apuntaron no podrán volver a entrar desde aquí.',
      actions: [
        { label: 'Sí, cerrarla', onClick: async () => {
            await dbClient.from('club_sesiones').update({ estado: 'cerrada' }).eq('id', sesionId).eq('anfitrion_id', currentUser.id);
            closeModal(); showToast('Sala cerrada.'); renderClubSalas();
          } },
        { label: 'No', style: 'bg-slate-100 text-slate-500', onClick: closeModal }
      ]
    });
  }

  async function clubElegirRol(sesionId, convId) {
    if (!convId) return showToast('Esta sala es de charla libre: no tiene papeles.');
    const { data: c } = await dbClient.from('conversaciones').select('conversacion, cantidad').eq('id', convId).maybeSingle();
    if (!c) return showToast('No se encontró el guion de esta sala.');
    const { roles } = parsearGuion(c.conversacion, c.cantidad);
    const { data: gente } = await dbClient.from('club_participantes').select('user_id, nombre, rol').eq('sesion_id', sesionId);

    const body = `<div class="space-y-2 text-left">${roles.map(r => {
      const quien = (gente || []).find(p => p.rol === r);
      const mio = quien && quien.user_id === currentUser.id;
      const libre = !quien || mio;
      return `<button class="cr-rol w-full flex items-center gap-2 px-3 py-2.5 rounded-xl border-2 ${mio ? 'border-[#FF7A00] bg-orange-50' : libre ? 'border-slate-200 bg-white hover:border-[#FF7A00]' : 'border-slate-100 bg-slate-50 opacity-60'}"
        data-rol="${escapeHTML(r)}" ${libre ? '' : 'disabled'}>
        <span class="font-black text-slate-700 flex-1 text-left">🎭 ${escapeHTML(r)}</span>
        <span class="text-[11px] font-bold ${mio ? 'text-[#FF7A00]' : 'text-slate-400'}">${mio ? 'Tu papel' : quien ? escapeHTML(primerNombre(quien.nombre)) : 'Libre'}</span>
      </button>`;
    }).join('')}</div>`;

    showModal({ icon: '🎭', title: 'Elige tu papel', body, size: 'md', actions: [] });
    modalRoot.querySelectorAll('.cr-rol').forEach(b => {
      b.onclick = async () => {
        const { error } = await dbClient.from('club_participantes')
          .update({ rol: b.dataset.rol }).eq('sesion_id', sesionId).eq('user_id', currentUser.id);
        closeModal();
        if (error) return showToast('⚠️ No se pudo cambiar el papel.');
        showToast(`🎭 Ahora eres <b>${escapeHTML(b.dataset.rol)}</b>.`);
        renderClubSalas();
      };
    });
  }

  /* ============================================================
     CLUB · PESTAÑA "GUIONES"  (tabla conversaciones)
  ============================================================ */
  let clubFiltroNivel = 'mi';   // 'mi' | 'todos' | nivel concreto

  async function renderClubGuiones() {
    const el = document.getElementById('club-body');
    if (!el) return;
    el.dataset.tab = 'guiones';
    el.innerHTML = spinnerHTML();

    let q = dbClient.from('conversaciones').select('*').order('nivel_ingles').order('titulo').limit(200);
    if (clubFiltroNivel === 'mi') q = q.ilike('nivel_ingles', miNivel());
    else if (clubFiltroNivel !== 'todos') q = q.ilike('nivel_ingles', clubFiltroNivel);
    const { data, error } = await q;
    if (error) { el.innerHTML = clubErrorHTML(error, 'conversaciones'); return; }

    const niveles = sortNiveles([...new Set([...NIVELES_FIJOS])]);
    const chip = (v, txt) => `<button data-filtro="${v}" class="cg-chip btn-juice ${clubFiltroNivel === v ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl">${txt}</button>`;

    const tarjetas = (data || []).map(c => {
      const { roles, lineas } = parsearGuion(c.conversacion, c.cantidad);
      const abierto = clubGuionOpen === c.id;
      const miRol = clubGuionRol[c.id] || null;

      const cuerpo = !abierto ? '' : `
        <div class="mt-2 pt-2 border-t border-slate-100">
          <div class="flex flex-wrap gap-1.5 mb-2">
            <span class="text-[10px] font-black text-slate-400 uppercase self-center mr-1">Tu papel:</span>
            ${roles.map(r => `<button class="cg-rol text-[11px] font-bold px-2.5 py-1 rounded-lg border ${miRol === r ? 'bg-[#FF7A00] text-white border-[#FF7A00]' : 'bg-white text-slate-600 border-slate-200'}" data-id="${c.id}" data-rol="${escapeHTML(r)}">${escapeHTML(r)}</button>`).join('')}
          </div>
          <div class="bg-slate-50 rounded-xl border border-slate-100 p-2.5 max-h-72 overflow-y-auto space-y-1.5">
            ${lineas.map((l, i) => l.rol === null
              ? `<p class="text-[11px] text-slate-400 italic text-center">${escapeHTML(l.texto)}</p>`
              : `<div class="flex items-start gap-2 ${miRol && l.rol === miRol ? 'bg-orange-50 border border-orange-200' : 'bg-white border border-slate-100'} rounded-lg px-2 py-1.5">
                   <span class="shrink-0 text-[10px] font-black ${miRol && l.rol === miRol ? 'text-[#FF7A00]' : 'text-slate-400'} uppercase mt-0.5 w-14 truncate" title="${escapeHTML(l.rol)}">${escapeHTML(l.rol)}</span>
                   <span class="flex-1 text-sm text-slate-700 font-medium">${escapeHTML(l.texto)}</span>
                   <button class="cg-say shrink-0 text-slate-300 hover:text-[#FF7A00]" data-say="${escapeHTML(l.texto)}" title="Escuchar"><i class="fas fa-volume-up text-xs"></i></button>
                 </div>`).join('')}
          </div>
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button class="cg-leer btn-juice bg-slate-100 text-slate-600 font-bold text-[11px] px-3 py-1.5 rounded-xl" data-id="${c.id}">🔊 Leer todo el guion</button>
            <button class="cg-sala btn-juice bg-[#FF7A00] text-white font-bold text-[11px] px-3 py-1.5 rounded-xl" data-id="${c.id}">📅 Crear sala con este guion</button>
          </div>
        </div>`;

      return `
        <div class="rounded-2xl border-2 ${abierto ? 'border-[#FF7A00]' : 'border-slate-200'} bg-white p-3 mb-2.5">
          <button class="cg-abrir w-full flex items-center gap-2 text-left" data-id="${c.id}">
            <span class="text-xl shrink-0">🎭</span>
            <span class="flex-1 min-w-0">
              <span class="block font-heading font-black text-slate-800 leading-tight truncate">${escapeHTML(c.titulo)}</span>
              <span class="block text-[11px] text-slate-400">${roles.length} papel${roles.length === 1 ? '' : 'es'} · ${lineas.filter(l => l.rol).length} frases</span>
            </span>
            ${nivelChip(c.nivel_ingles)}
            <i class="fas fa-chevron-${abierto ? 'up' : 'down'} text-slate-300 text-xs shrink-0"></i>
          </button>
          ${cuerpo}
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-3">
        ${chip('mi', `⭐ Mi nivel (${miNivel()})`)}${chip('todos', 'Todos')}${niveles.map(n => chip(n, n)).join('')}
      </div>
      ${tarjetas || `<div class="text-center py-6">
        <p class="text-4xl mb-2">🎭</p>
        <p class="text-slate-500 font-bold">No hay guiones para este filtro.</p>
        <p class="text-slate-400 text-xs mt-1">Los guiones se cargan en la tabla <b>conversaciones</b> de Supabase.</p>
      </div>`}`;

    el.querySelectorAll('.cg-chip').forEach(b => b.onclick = () => { clubFiltroNivel = b.dataset.filtro; renderClubGuiones(); });
    el.querySelectorAll('.cg-abrir').forEach(b => b.onclick = () => {
      const id = parseInt(b.dataset.id);
      clubGuionOpen = clubGuionOpen === id ? null : id;
      stopSpeaking();
      renderClubGuiones();
    });
    el.querySelectorAll('.cg-rol').forEach(b => b.onclick = () => {
      const id = parseInt(b.dataset.id);
      clubGuionRol[id] = clubGuionRol[id] === b.dataset.rol ? null : b.dataset.rol;
      renderClubGuiones();
    });
    el.querySelectorAll('.cg-say').forEach(b => b.onclick = () => { stopSpeaking(); speak(b.dataset.say); });
    el.querySelectorAll('.cg-leer').forEach(b => b.onclick = () => {
      const c = (data || []).find(x => x.id === parseInt(b.dataset.id));
      if (c) leerGuion(parsearGuion(c.conversacion, c.cantidad).lineas.filter(l => l.rol));
    });
    el.querySelectorAll('.cg-sala').forEach(b => b.onclick = async () => {
      clubTab = 'salas'; clubPintarTabs();
      await clubFormSala();
      const sel = document.getElementById('cs-conv');
      if (sel) { sel.value = b.dataset.id; sel.onchange(); }
    });
  }

  // Lee el guion completo, frase por frase, para ensayar la pronunciación.
  function leerGuion(lineas, i = 0) {
    if (!clubActivo() || i >= lineas.length) return stopSpeaking();
    speak(lineas[i].texto, () => setTimeout(() => leerGuion(lineas, i + 1), 350));
  }

  /* ============================================================
     CLUB · PESTAÑA "CHAT"  (mensajes entre estudiantes)
  ============================================================ */
  function renderClubChat() {
    const el = document.getElementById('club-body');
    if (!el) return;
    el.dataset.tab = 'chat';
    clubUltId = 0;

    const salas = ['general', ...NIVELES_FIJOS];
    const chips = salas.map(s => `
      <button data-sala="${s}" class="cc-sala btn-juice ${clubSala === s ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl">
        ${s === 'general' ? '🌎 General' : s}
      </button>`).join('');

    el.innerHTML = `
      <div class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-2">${chips}</div>
      <div id="cc-box" class="chat-scroll h-[46vh] min-h-[220px] overflow-y-auto p-2 space-y-2 mb-2 bg-slate-50 rounded-xl border border-slate-100">${spinnerHTML()}</div>
      <div class="flex gap-2">
        <input id="cc-input" type="text" maxlength="${CLUB_MSG_MAX_LEN}" placeholder="Escribe en inglés..." autocomplete="off" enterkeyhint="send"
          class="flex-1 min-w-0 bg-white border-2 border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-[#FF7A00] text-slate-700 font-medium">
        <button id="cc-send" class="btn-juice bg-[#FF7A00] text-white font-bold px-4 py-2 rounded-xl shrink-0"><i class="fas fa-paper-plane"></i></button>
      </div>
      <p class="text-[10px] text-slate-400 mt-1.5 text-center">
        Escribe en inglés y gana <b>+${CLUB_MSG_POINTS} puntos</b> por mensaje (hasta ${CLUB_MSG_DAILY_MAX} al día).
        Sé amable: aquí todos estamos aprendiendo. 💛
      </p>`;

    el.querySelectorAll('.cc-sala').forEach(b => b.onclick = () => { clubSala = b.dataset.sala; renderClubChat(); });
    const input = document.getElementById('cc-input');
    document.getElementById('cc-send').onclick = clubEnviarMensaje;
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') clubEnviarMensaje(); });
    clubCargarMensajes();
  }

  async function clubCargarMensajes() {
    const box = document.getElementById('cc-box');
    if (!box) return;
    const { data, error } = await dbClient.from('club_mensajes')
      .select('*').eq('sala', clubSala).order('id', { ascending: false }).limit(60);
    if (error) { box.innerHTML = clubErrorHTML(error, 'club_mensajes'); return; }

    const msgs = (data || []).slice().reverse();
    const maxId = msgs.length ? msgs[msgs.length - 1].id : 0;
    if (maxId === clubUltId && box.dataset.pintado === '1') return;   // nada nuevo
    const pegadoAbajo = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

    box.innerHTML = msgs.length ? msgs.map(m => {
      const yo = m.user_id === currentUser.id;
      return `
        <div class="flex ${yo ? 'justify-end' : 'justify-start'} items-end gap-1.5">
          ${yo ? '' : inicialHTML(m.nombre)}
          <div class="${yo ? 'bg-[#FF7A00] text-white rounded-br-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'} rounded-2xl px-3 py-2 max-w-[80%] shadow-sm">
            ${yo ? '' : `<div class="flex items-center gap-1.5 mb-0.5">
              <span class="text-[11px] font-black text-slate-600">${escapeHTML(primerNombre(m.nombre))}</span>
              ${nivelChip(m.nivel)}
            </div>`}
            <div class="font-medium leading-snug break-words">${escapeHTML(m.mensaje)}</div>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="text-[9px] ${yo ? 'text-white/70' : 'text-slate-400'}">${escapeHTML(clubHora(m.created_at))}</span>
              <button class="cc-say text-[9px] ${yo ? 'text-white/70 hover:text-white' : 'text-slate-300 hover:text-[#FF7A00]'}" data-say="${escapeHTML(m.mensaje)}" title="Escuchar"><i class="fas fa-volume-up"></i></button>
              ${yo ? `<button class="cc-del text-[9px] text-white/70 hover:text-white ml-auto" data-id="${m.id}" title="Borrar"><i class="fas fa-trash"></i></button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('') : `<p class="text-slate-400 text-center text-sm py-8">Todavía no hay mensajes en ${clubSala === 'general' ? 'la sala general' : 'la sala ' + clubSala}.<br>¡Saluda al club! 👋</p>`;

    box.dataset.pintado = '1';
    clubUltId = maxId;
    if (pegadoAbajo) box.scrollTop = box.scrollHeight;

    box.querySelectorAll('.cc-say').forEach(b => b.onclick = () => { stopSpeaking(); speak(b.dataset.say); });
    box.querySelectorAll('.cc-del').forEach(b => b.onclick = async () => {
      await dbClient.from('club_mensajes').delete().eq('id', parseInt(b.dataset.id)).eq('user_id', currentUser.id);
      box.dataset.pintado = '0';
      clubCargarMensajes();
    });
  }

  async function clubEnviarMensaje() {
    const input = document.getElementById('cc-input');
    if (!input) return;
    const texto = (input.value || '').trim().slice(0, CLUB_MSG_MAX_LEN);
    if (!texto) return;
    input.value = '';
    input.focus();

    const { error } = await dbClient.from('club_mensajes').insert({
      user_id: currentUser.id, nombre: miNombre(), nivel: miNivel(), sala: clubSala, mensaje: texto
    });
    if (error) { showToast('⚠️ No se pudo enviar: ' + escapeHTML(error.message)); input.value = texto; return; }

    ensureDaily();
    if ((flujo.daily.club.msgs || 0) < CLUB_MSG_DAILY_MAX) {
      flujo.daily.club.msgs = (flujo.daily.club.msgs || 0) + 1;
      await updateUserFlow();
      await addPoints(CLUB_MSG_POINTS);
    }
    const box = document.getElementById('cc-box'); if (box) box.dataset.pintado = '0';
    clubCargarMensajes();
  }

  /* ============================================================
     CLUB · PESTAÑA "EN LÍNEA"
  ============================================================ */
  async function renderClubGente() {
    const el = document.getElementById('club-body');
    if (!el) return;
    if (el.dataset.tab !== 'gente') { el.dataset.tab = 'gente'; el.innerHTML = spinnerHTML(); }

    if (error) { el.innerHTML = clubErrorHTML(error, 'club_presencia'); return; }

    const gente = (data || []).filter(p => p.user_id !== currentUser.id);
    el.innerHTML = `
      <p class="text-xs text-slate-400 text-center mb-3">
        <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1 align-middle"></span>
        ${gente.length} estudiante${gente.length === 1 ? '' : 's'} en el club ahora mismo
      </p>
      ${gente.length ? `<div class="space-y-1.5 max-h-80 overflow-y-auto pr-1">${gente.map(p => `
        <div class="flex items-center gap-2.5 px-3 py-2 rounded-xl bg-slate-50">
          ${inicialHTML(p.nombre)}
          <span class="flex-1 font-bold text-slate-700 truncate">${escapeHTML(primerNombre(p.nombre))}</span>
          ${nivelChip(p.nivel)}
          <button class="cp-invitar btn-juice bg-[#FF7A00] text-white font-bold text-[10px] px-2.5 py-1.5 rounded-lg shrink-0" data-nombre="${escapeHTML(primerNombre(p.nombre))}">Invitar</button>
        </div>`).join('')}</div>`
        : `<div class="text-center py-6">
             <p class="text-4xl mb-2">👀</p>
             <p class="text-slate-500 font-bold">Nadie más está conectado ahora.</p>
             <p class="text-slate-400 text-xs mt-1">Deja un mensaje en el 💬 Chat o crea una 📅 Sala para más tarde: los demás la verán al entrar.</p>
           </div>`}`;

    // "Invitar" deja un mensaje en el chat general mencionando a la persona.
    el.querySelectorAll('.cp-invitar').forEach(b => b.onclick = async () => {
      const nombre = b.dataset.nombre;
      await dbClient.from('club_mensajes').insert({

  /* Motor principal: frases con verbo en varios tiempos.

    if (filt === 'reg') vs = vs.filter(v => v.reg);

    const V = gPick(vs), O = gPick(V.obj), C = V.es;

    if (mode === 'pres') {
      const T = gPick(GEN.time);
      return neg
        ? { en: `${S.en} ${yo ? "don't" : "doesn't"} ${V.b} ${O[0]} ${T[0]}.`, es: `${suj} no ${yo ? C[1] : C[2]} ${O[1]} ${T[1]}.` }
        : { en: `${S.en} ${yo ? V.b : V.s} ${O[0]} ${T[0]}.`, es: `${suj} ${yo ? C[1] : C[2]} ${O[1]} ${T[1]}.` };

        : { en: `${S.en} ${S.be} ${V.ing} ${O[0]} right now.`, es: `${suj} ${yo ? 'estoy' : 'está'} ${C[3]} ${O[1]} ahora mismo.` };
    }

      return neg

  function genBe() {

  function genClock() {
    const hEn = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
    const hEs = ['', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce'];
    const h = 1 + Math.floor(Math.random() * 12);
    const m = gPick([0, 15, 30, 45, 10, 20]);
    const nx = h === 12 ? 1 : h + 1;
    const son = (x) => x === 1 ? 'Es la' : 'Son las';
    if (m === 0)  return { en: `It's ${hEn[h]} o'clock.`, es: `${son(h)} ${hEs[h]} en punto.` };
