    .pt-20 { padding-top: 5rem !important; }

    .font-heading { font-family: 'Space Grotesk', sans-serif; }

    /* --- Diseño "Juicy" --- */
    .card-3d {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 0 #cbd5e1, 0 10px 20px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid #e2e8f0;
      position: relative;
      top: 0;
    }
    .btn-juice { transition: all 0.1s; border-bottom: 6px solid rgba(0,0,0,0.2); transform: translateY(0); }
    .btn-juice:active { transform: translateY(6px); border-bottom-width: 0; box-shadow: inset 0 6px 10px rgba(0,0,0,0.2); }

    .progress-track { background: #e2e8f0; height: 10px; border-radius: 99px; overflow: hidden; margin-top: 2px; }
    .progress-fill { background: linear-gradient(90deg, #FF7A00, #ffaa00); height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.4s ease-out forwards; }

    @keyframes floatPoints { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
    .floating-points { position: absolute; color: #fbbf24; font-weight: 900; font-size: 2.5rem; z-index: 100; animation: floatPoints 1s ease-out forwards; pointer-events: none; text-shadow: 0 4px 0 rgba(0,0,0,0.1); }

    .wrong-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

    /* Modal genérico */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 200; }

    /* Toast (avisos rápidos de recompensa) */
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
      background: #1e293b; color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 300; opacity: 0;
      transition: opacity .25s, transform .25s; pointer-events: none; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Barra de herramientas superior */
    .tool-btn { transition: transform 0.15s; min-width: 44px; }
    .tool-btn:active { transform: scale(0.90); }

    /* Pista "toca aquí" del menú de perfil */
    @keyframes hintBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .menu-hint { animation: hintBounce 1.3s ease-in-out infinite; }

    /* Chat con Abu */
    .chat-scroll { scrollbar-width: thin; scroll-behavior: smooth; }
    .no-bar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-bar::-webkit-scrollbar { display: none; }
    @keyframes tipIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .quick-reply { animation: tipIn .25s ease-out both; }
    .word-chip { transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .word-chip.used {
      background: #dcfce7 !important; color: #16a34a !important;
      border-color: #86efac !important; transform: scale(1.06);
      box-shadow: 0 2px 8px rgba(22,163,74,.18);
    }
    .word-chip.used::after { content: " ✓"; font-weight: 900; }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    #ai-messages > div { animation: bubbleIn .22s ease-out both; }

<script type="module">
function openAbuChat() {
    const nivel = flujo?.currentNivel || 'A1';
    const group = flujo?.niveles?.[nivel]?.currentGroup || null;
    
    // Llama directamente a la función que renderiza el chat de Abu en el app-container
    startChatPractice(nivel, group, false);
}
  /* ============================================================
     1. CONFIGURACIÓN Y ESTADO
  ============================================================ */
  const SUPABASE_URL = 'https://eylwewhqeaaqkgcxhgyv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5bHdld2hxZWFhcWtnY3hoZ3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMzAxODgsImV4cCI6MjA5OTkwNjE4OH0.Ji8huj-ny2VcMT5UQSjOuwUKz4k23quNS0fLk-gZr7A';

  // Enlace para la conversión a Pro (mismo que usa la landing)
  const PRO_UPGRADE_URL = 'https://wa.me/573163748711';
  const ABULINGO_URL = 'https://abulingo.github.io/';   // se usa al invitar y al compartir

  // WhatsApp al que se pide el certificado de un nivel completado
  const CERT_WHATSAPP_URL = 'https://wa.me/573163748711';

  // Algoritmo de memorización espaciada (tipo SM-2 simplificado)
  const SRS_INTERVALS_DAYS = [0.007, 1, 2, 4, 8, 15, 30, 60]; // días por nivel de SRS
  const EASE_DEFAULT = 2.5, EASE_MIN = 1.3, EASE_MAX = 3.0;
  const GRADUATED_LEVEL = SRS_INTERVALS_DAYS.length - 1; // al llegar aquí la palabra se considera dominada
  const SRS_SESSION_MAX = 30;   // máximo de palabras por sesión de "¡Toca repasar!"

  /* ── Control de repeticiones y palabras DIFÍCILES ─────────────
     · SRS_MAX_SHOWS_PER_DAY: una misma palabra NO aparece en repaso
       más de este número de veces el mismo día (antes "would" podía
       salir 4+ veces y cansaba).
     · Las palabras marcadas "Difícil" o con fallos se consideran
       DIFÍCILES: vuelven en la MITAD del tiempo (se repiten más),
       aunque completes bien las tres prácticas, hasta que las
       aciertes DIFFICULT_CLEAR_STREAK veces seguidas.               */
  const SRS_MAX_SHOWS_PER_DAY   = 2;    // máx. apariciones de la MISMA palabra por día
  const SRS_FAIL_GAP_MIN        = 30;   // tras un fallo, espera mínima (minutos) para reaparecer
  const SRS_OK_GAP_H            = 20;   // tras acertar (palabra normal), no vuelve antes de ~20 h
  const SRS_OK_DIFFICULT_GAP_H  = 4;    // tras acertar una DIFÍCIL, puede volver el mismo día (a las 4 h)
  const DIFFICULT_INTERVAL_FACTOR = 0.5; // las difíciles vuelven en la mitad del intervalo normal
  const DIFFICULT_CLEAR_STREAK  = 3;    // aciertos seguidos para que deje de ser "difícil"

  /* ╔══════════════════════════════════════════════════════════════╗
     ║  LÍMITE DE PALABRAS NUEVAS  —  EDITA SOLO ESTAS DOS LÍNEAS   ║
     ╠══════════════════════════════════════════════════════════════╣
     ║ NEW_WORDS_PER_TANDA  = palabras NUEVAS por tanda.            ║
     ║ NEW_WORDS_COOLDOWN_H = horas de espera al agotar la tanda    ║
     ║                        (12 = medio día). Pasado ese tiempo   ║
     ║                        el contador se reinicia solo.         ║
     ║ Los REPASOS nunca se bloquean: sólo las palabras nuevas.     ║
     ╚══════════════════════════════════════════════════════════════╝ */
  const NEW_WORDS_PER_TANDA  = 1000;
  const NEW_WORDS_COOLDOWN_H = 12;

  const CHAT_GOAL = 1;         // mensajes que debes enviar para completar la charla con Abu
  const DAILY_GOAL_POINTS = 60; // meta diaria de puntos → recompensa (1 lingot)
  const CEFR_ORDER = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  const NIVELES_FIJOS = ['A1', 'A2', 'B1', 'B2']; // siempre visibles en el selector

  const ENCOURAGEMENTS = [
    { icon: '🚀', title: '¡Vas muy bien!', msg: 'Tu memoria se está fortaleciendo. Sigue así.' },
    { icon: '🔥', title: '¡Racha encendida!', msg: 'Cada acierto fija mejor las palabras en tu mente.' },
    { icon: '💪', title: '¡Imparable!', msg: 'Estás aprendiendo de forma efectiva. ¡No pares!' },
    { icon: '🌟', title: '¡Excelente trabajo!', msg: 'Vas por muy buen camino, sigue sumando.' }
  ];

  const { createClient } = supabase;
  const dbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let userProfile = null;
  let flujo = null; // atajo a userProfile.flujo

  let sessionStreak = 0;      // racha de aciertos de la sesión (influye en SRS y puntos)
  let sessionCorrect = 0;     // aciertos totales de la sesión (para mensajes de ánimo)
  let lastMilestone = 0;

  // Caché de palabras del grupo actual
  let groupCache = { key: null, list: [], map: {} };
  // Sesión de repaso SRS transitoria
  let srsSession = null;
  // Sesión de repaso inicial (flashcards)
  let reviewList = [];

  const appContainer = document.getElementById('app-container');
  const toolsBar = document.getElementById('top-bar');

  /* ============================================================
     2. UTILIDADES GENERALES
  ============================================================ */
  const norm = (s) => (s || '').toString().trim().toLowerCase().replace(/[.,!?;:'"]/g, '');
  const todayStr = () => new Date().toISOString().slice(0, 10);

  /* Solo el PRIMER nombre: "Nikol Yuliana Heredia Rangel" → "Nikol".
     Se usa en el ranking, el menú de perfil y el Club: más corto,
     más cercano y no expone el apellido de nadie ante desconocidos. */
  function primerNombre(nombre, porDefecto = 'Anónimo') {
    const limpio = (nombre || '').toString().replace(/\s+/g, ' ').trim();
    if (!limpio) return porDefecto;
    return limpio.split(' ')[0];
  }
  const escapeHTML = (s) => (s || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /*
    Estado diario. Dos relojes distintos:
      · La META DE PUNTOS y los contadores del día se reinician a medianoche.
      · Las PALABRAS NUEVAS van por TANDAS: al agotar NEW_WORDS_PER_TANDA se
        bloquean NEW_WORDS_COOLDOWN_H horas (medio día) y luego se reinician
        solas, sin esperar a mañana.
  */
  function ensureDaily() {
    if (!flujo.daily) flujo.daily = { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null };
    if (flujo.daily.unlockAt === undefined) flujo.daily.unlockAt = null;

    // Reinicio de medianoche (meta de puntos y estadísticas del día)
    if (flujo.daily.date !== todayStr()) {
      flujo.daily.date = todayStr();
      flujo.daily.points = 0;
      flujo.daily.reviewed = 0;
      flujo.daily.goalShown = false;
      flujo.daily.club = { msgs: 0, joins: 0 };
    }
    if (!flujo.daily.club) flujo.daily.club = { msgs: 0, joins: 0 };
    // Fin del descanso: se libera una tanda nueva de palabras
    if (flujo.daily.unlockAt && Date.now() >= new Date(flujo.daily.unlockAt).getTime()) {
      flujo.daily.unlockAt = null;
      flujo.daily.newWords = 0;
    }
    if (!flujo.racha) flujo.racha = { days: 0, last: null, best: 0 };
  }

  // ¿Se agotó la tanda de palabras nuevas? Si acaba de agotarse, arranca el reloj.
  function newWordsLocked() {
    ensureDaily();
    if (flujo.daily.unlockAt) return true;
    if ((flujo.daily.newWords || 0) >= NEW_WORDS_PER_TANDA) {
      flujo.daily.unlockAt = new Date(Date.now() + NEW_WORDS_COOLDOWN_H * 3600000).toISOString();
      updateUserFlow();
      return true;
    }
    return false;
  }
  function newWordsLeft() { ensureDaily(); return Math.max(0, NEW_WORDS_PER_TANDA - (flujo.daily.newWords || 0)); }

  // "3 h 25 min" a partir de milisegundos
  function fmtEspera(ms) {
    const min = Math.max(1, Math.round(ms / 60000));
    const h = Math.floor(min / 60), m = min % 60;
    if (h && m) return `${h} h ${m} min`;
    if (h) return `${h} h`;
    return `${m} min`;
  }

  // Racha de días consecutivos: se enciende con la primera actividad del día.
  function touchStreak() {
    ensureDaily();
    const hoy = todayStr();
    if (flujo.racha.last === hoy) return;
    const ayer = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    flujo.racha.days = (flujo.racha.last === ayer) ? (flujo.racha.days || 0) + 1 : 1;
    flujo.racha.last = hoy;
    flujo.racha.best = Math.max(flujo.racha.best || 0, flujo.racha.days);
    updateStreakUI();
    if (flujo.racha.days > 1) showToast(`🔥 ¡Racha de ${flujo.racha.days} días! No la rompas.`);
  }
  function updateStreakUI() {
    const el = document.getElementById('streak-days');
    if (el && flujo && flujo.racha) el.textContent = flujo.racha.days || 0;
  }

  let toastTimer = null;
  function showToast(msg, ms = 2600) {
    let t = document.getElementById('app-toast');
    if (!t) { t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = msg;
    sfx('toast');
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function sortNiveles(arr) {
    return [...arr].sort((a, b) => {
      const ia = CEFR_ORDER.indexOf(a), ib = CEFR_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || String(a).localeCompare(String(b));
    });
  }
  function sortGroups(arr) {
    return [...arr].sort((a, b) => {
      const na = parseInt(String(a).replace(/\D/g, '')), nb = parseInt(String(b).replace(/\D/g, ''));
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return String(a).localeCompare(String(b));
    });
  }

  function playSound(type) {
    const id = type === 'correct' ? 'snd-correct' : (type === 'wrong' ? 'snd-wrong' : 'snd-complete');

  /*
    Sonidos de interacción sintetizados con WebAudio (sin archivos externos):
    'click' → tap de botón · 'flip' → aparece una tarjeta/ejercicio ·
    'pop' → se abre un modal · 'toast' → aviso de recompensa · 'type' → teclas del chat
  */
  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    } catch { return null; }
  }
  function tone(ctx, { freq = 600, freqEnd = null, dur = 0.06, type = 'sine', vol = 0.12, delay = 0 }) {
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function sfx(kind) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      if (kind === 'click')      tone(ctx, { freq: 880, freqEnd: 660, dur: 0.05, type: 'triangle', vol: 0.08 });
      else if (kind === 'flip')  tone(ctx, { freq: 320, freqEnd: 620, dur: 0.10, type: 'sine', vol: 0.10 });
      else if (kind === 'pop')   { tone(ctx, { freq: 500, freqEnd: 900, dur: 0.08, type: 'sine', vol: 0.10 }); }
      else if (kind === 'toast') { tone(ctx, { freq: 780, dur: 0.09, type: 'sine', vol: 0.10 }); tone(ctx, { freq: 1040, dur: 0.12, type: 'sine', vol: 0.10, delay: 0.09 }); }
      else if (kind === 'type')  tone(ctx, { freq: 1200, dur: 0.02, type: 'square', vol: 0.03 });
    } catch { /* silencio */ }
  }
  // Tap sonoro en cualquier botón de la app (delegado, no requiere cablear cada uno).
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) sfx('click');
  }, { passive: true });

  // Reproduce el audio de la palabra; si no hay, usa síntesis de voz.
  window.playWordAudio = (word) => {

    else if (word) { speak(word.ingles); }

  // Síntesis de voz (Text-to-Speech) en inglés
  let ttsVoices = [];
  function loadVoices() { ttsVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickEnglishVoice() {
    if (!ttsVoices.length) loadVoices();
    return ttsVoices.find(v => /en[-_]US/i.test(v.lang)) || ttsVoices.find(v => /^en/i.test(v.lang)) || null;
  }
  function speak(text, onend) {
    if (!window.speechSynthesis) { if (onend) onend(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = pickEnglishVoice();
    if (v) u.voice = v;
    u.lang = 'en-US'; u.rate = 0.95;
    if (onend) u.onend = onend;
    window.speechSynthesis.speak(u);
  }
  function stopSpeaking() { if (window.speechSynthesis) window.speechSynthesis.cancel(); }

  /*

      así aunque recargues o cierres antes de que termine el guardado
      en la nube, tu avance NO se pierde ni vuelves al inicio.
    · Luego se sube a Supabase con un reintento; si aun así falla,
      se avisa con un toast (antes fallaba en silencio y al recargar
      todo lo estudiado volvía a aparecer desde cero).
    · Al arrancar, si el respaldo local es MÁS RECIENTE que lo que hay
      en la nube, se restaura el local y se re-sube.
  */
  const flujoLSKey = () => `abulingo_flujo_${currentUser?.id || 'anon'}`;
  function guardarFlujoLocal() {
    if (!flujo || !currentUser) return;
    try { localStorage.setItem(flujoLSKey(), JSON.stringify(flujo)); } catch { /* almacenamiento lleno */ }
  }
  // Respaldo extra al ocultar/cerrar la pestaña (síncrono: siempre alcanza a correr)

  async function updateUserFlow() {
    flujo.savedAt = new Date().toISOString();
    userProfile.flujo = flujo;
    guardarFlujoLocal();   // respaldo inmediato: pase lo que pase, el avance queda
    for (let intento = 0; intento < 2; intento++) {
      const { error } = await dbClient.from('profiles').update({ flujo }).eq('id', currentUser.id);

  /*
    Núcleo del algoritmo de memorización espaciada.
    Se guarda en flujo.srs (columna "flujo") y se replica en user_word_progress (durabilidad).
    Los PUNTOS influyen en el SRS: una racha alta añade un pequeño bono de "ease",
    lo que alarga el intervalo (repasas menos lo que ya dominas).
  */
  /*
    result: 'easy' | 'hard'  (tarjeta ✨ Repaso)  ·  'practice_correct' | 'practice_wrong' (ejercicios)
    opts.type: 'flashcard' | 'select_by_image' | 'write_by_audio'

    Regla de DOMINIO INMEDIATO: si la palabra se marcó "Fácil" en su primer repaso
    Y el primer intento de "Identifica la imagen" Y de "Escucha y escribe" fueron
    correctos (sin ningún fallo), se marca learned=true y NUNCA vuelve a "¡Toca repasar!".
    Las demás palabras siguen el ciclo SRS hasta graduarse en el intervalo máximo.
  */
  async function updateSRS(wordId, result, opts = {}) {
    ensureDaily();
    const key = String(wordId);
    const isNew = !flujo.srs[key];
    const s = flujo.srs[key] || { level: 0, ease: EASE_DEFAULT, reps: 0, lapses: 0, due: null, learned: false, easyFirst: false, first: {}, difficult: false, okStreak: 0 };
    if (!s.first) s.first = {};
    if (isNew) flujo.daily.newWords = (flujo.daily.newWords || 0) + 1; // cuenta para el límite diario

    // ── Contador de apariciones del día (evita "would" 4 veces en un día) ──
    if (s.day !== todayStr()) { s.day = todayStr(); s.shownToday = 0; }
    s.shownToday = (s.shownToday || 0) + 1;

    const ok = (result === 'easy' || result === 'correct' || result === 'practice_correct');
    const hard = (result === 'hard');
    const type = opts.type || null;

    // Registro del PRIMER intento por tipo (antes de tocar reps/lapses)
    if (type === 'flashcard' && s.reps === 0 && s.lapses === 0 && !s.easyFirst) {
      s.easyFirst = (result === 'easy');
    }
    if ((type === 'select_by_image' || type === 'write_by_audio') && s.first[type] === undefined) {
      s.first[type] = ok;
    }

    let points = 0;

    if (ok) {
      sessionStreak++;
      sessionCorrect++;
      flujo.stats.totalCorrect = (flujo.stats.totalCorrect || 0) + 1;
      const streakBonus = Math.min(sessionStreak * 0.02, 0.12); // la racha alarga el intervalo
      s.reps++;
      s.ease = Math.min(EASE_MAX, s.ease + (result === 'easy' ? 0.15 : 0.08) + streakBonus);
      s.level = Math.min(s.level + 1, SRS_INTERVALS_DAYS.length - 1);
      // Una DIFÍCIL deja de serlo tras varios aciertos seguidos.
      s.okStreak = (s.okStreak || 0) + 1;
      if (s.difficult && s.okStreak >= DIFFICULT_CLEAR_STREAK) {
        s.difficult = false;
        setTimeout(() => showToast('💪 ¡Le ganaste a una palabra difícil! Ya va a ritmo normal.'), 500);
      }
      points = (result === 'easy' ? 12 : 10) + Math.min(sessionStreak, 8); // bono por racha
      if (Math.random() < 0.08) { points += 5; setTimeout(() => showToast('🎁 ¡Bonus sorpresa! +5 puntos extra'), 400); }
      playSound('correct'); triggerConfetti();
    } else if (hard) {
      s.reps++;
      s.ease = Math.max(EASE_MIN, s.ease - 0.15);
      // el nivel se mantiene
      s.difficult = true;   // marcarla "Difícil" la mete al ciclo de refuerzo
      s.okStreak = 0;
      points = 3;
    } else { // fallo
      sessionStreak = 0;
      flujo.stats.totalWrong = (flujo.stats.totalWrong || 0) + 1;
      s.lapses++;
      s.ease = Math.max(EASE_MIN, s.ease - 0.2);
      s.level = Math.max(0, s.level - 2); // retrocede 2 niveles (no castiga hasta cero: mejor experiencia)
      s.difficult = true;   // fallar en cualquier práctica = necesita más repeticiones
      s.okStreak = 0;
      points = 0;
      playSound('wrong');
    }

    // ¿Dominio inmediato? Fácil a la primera + ambos ejercicios bien al primer intento + cero fallos.
    // opts.word llega desde el repaso SRS: esas palabras pueden ser de otro nivel
    // y por eso no están en groupCache (caché del grupo que estás estudiando).
    const word = opts.word || groupCache.map[key];
    const requiereImagen = word ? !!word.imagen : true;
    const imagenOk = !requiereImagen || s.first.select_by_image === true;
    const audioOk = s.first.write_by_audio === true;
    // El dominio inmediato exige además NO estar marcada como difícil.
    if (!s.learned && s.easyFirst && imagenOk && audioOk && s.lapses === 0 && !s.difficult) {
      s.learned = true;
      setTimeout(() => showToast('🏅 ¡Palabra dominada a la primera! No volverá a repaso.'), 600);
    }
    // Graduación normal: alcanzó el intervalo máximo del SRS.
    // Las DIFÍCILES no se gradúan hasta demostrar aciertos seguidos (deja de ser difícil).
    if (!s.learned && s.level >= GRADUATED_LEVEL && !s.difficult) {
      s.learned = true;
      setTimeout(() => showToast('🎓 ¡Palabra graduada! Ya vive en tu memoria a largo plazo.'), 600);
    }

    if (s.learned) {
      s.due = null; // dominada: fuera de "¡Toca repasar!" para siempre
    } else {
      const baseDays = SRS_INTERVALS_DAYS[s.level];
      let days = Math.max(0.005, baseDays * (s.ease / EASE_DEFAULT));
      // Las difíciles vuelven en la MITAD del tiempo: se repiten más
      // aunque hayas completado bien ✨, 👁️ y 👂.
      if (s.difficult) days = days * DIFFICULT_INTERVAL_FACTOR;

      let dueMs = Date.now() + days * 86400000;

      // Separación mínima para no ver la misma palabra en bucle:
      //  · fallo → mínimo 30 min · acierto normal → ~20 h (mañana)
      //  · acierto de una difícil → 4 h (puede reforzarse el mismo día, con tope)
      const gapMs = ok
        ? (s.difficult ? SRS_OK_DIFFICULT_GAP_H : SRS_OK_GAP_H) * 3600000
        : SRS_FAIL_GAP_MIN * 60000;
      dueMs = Math.max(dueMs, Date.now() + gapMs);

      // Tope diario: si ya apareció SRS_MAX_SHOWS_PER_DAY veces hoy,
      // se pospone hasta mañana en la mañana (aunque haya fallado).
      if ((s.shownToday || 0) >= SRS_MAX_SHOWS_PER_DAY) {
        const manana = new Date(); manana.setHours(24 + 7, 0, 0, 0); // mañana 7:00 am
        dueMs = Math.max(dueMs, manana.getTime());
      }
      s.due = new Date(dueMs).toISOString();
    }
    s.updated = new Date().toISOString();

    flujo.srs[key] = s;
    touchStreak();

    // Guardado principal en la columna flujo
    await updateUserFlow();
    if (points) await addPoints(points);

    // Réplica (no bloqueante) en la tabla dedicada. next_review_at es NOT NULL:
    // para palabras dominadas se guarda una fecha lejana.
    dbClient.from('user_word_progress').upsert({
      user_id: currentUser.id,
      word_id: wordId,
      srs_level: s.level,
      ease_factor: s.ease,
      next_review_at: s.due || '2099-12-31T00:00:00.000Z'
    }, { onConflict: 'user_id, word_id' }).then(({ error }) => {
      if (error) console.warn('user_word_progress (opcional):', error.message);
    });
  }

  /* ============================================================
     5. DATOS (palabras / niveles / grupos / repasos)
  ============================================================ */
  async function getNiveles() {
    /*
      ARREGLO "Sin contenido": la consulta anterior traía TODAS las filas de "palabras"
      y PostgREST corta en 1000, así que los niveles cuyas filas quedaban fuera del corte
      (p. ej. A1/A2) aparecían como vacíos. Ahora se cuenta por nivel con head:true
      (sin traer filas) y con fallback insensible a mayúsculas/minúsculas.
    */
    const candidatos = [...new Set([...NIVELES_FIJOS, ...CEFR_ORDER])];
    const conContenido = [];
    await Promise.all(candidatos.map(async (n) => {
      let { count, error } = await dbClient.from('palabras').select('id', { count: 'exact', head: true }).eq('nivel', n);
      if ((error || !count)) {
        // fallback: 'a1', 'A1 ', etc.
        const r2 = await dbClient.from('palabras').select('id', { count: 'exact', head: true }).ilike('nivel', n);
        count = r2.count; error = r2.error;
      }
      if (!error && (count || 0) > 0) conContenido.push(n);
    }));
    // Complemento: detectar niveles con nombres fuera del estándar CEFR (dentro del primer bloque de filas).
    const { data } = await dbClient.from('palabras').select('nivel').range(0, 999);
    (data || []).forEach(r => {
      const v = (r.nivel || '').trim();
      if (v && !conContenido.some(c => c.toLowerCase() === v.toLowerCase())) conContenido.push(v);
    });
    console.log('[getNiveles] niveles con contenido:', conContenido);
    return sortNiveles(conContenido);
  }
  async function getGroups(nivel) {
    let { data, error } = await dbClient.from('palabras').select('grupo').eq('nivel', nivel).range(0, 9999);
    if (!error && !(data || []).length) {
      ({ data, error } = await dbClient.from('palabras').select('grupo').ilike('nivel', nivel).range(0, 9999));
    }
    if (error) { console.error(`[getGroups ${nivel}] ❌`, error.message, error); return []; }
    const set = sortGroups([...new Set((data || []).map(r => (r.grupo || '').trim()).filter(Boolean))]);
    console.log(`[getGroups ${nivel}] grupos:`, set);
    return set;
  }
  async function getGroupWords(nivel, group) {
    const key = `${nivel}|${group}`;
    if (groupCache.key === key && groupCache.list.length) return groupCache.list;
    let { data, error } = await dbClient.from('palabras').select('*').eq('nivel', nivel).eq('grupo', group).range(0, 9999);
    if (!error && !(data || []).length) {
      ({ data, error } = await dbClient.from('palabras').select('*').ilike('nivel', nivel).ilike('grupo', group).range(0, 9999));
    }
    if (error) { console.error(`[getGroupWords ${key}] ❌`, error.message, error); return []; }
    const list = data || [];
    console.log(`[getGroupWords ${key}] palabras:`, list.length, list.map(w => w.ingles));
    groupCache = { key, list, map: Object.fromEntries(list.map(w => [String(w.id), w])) };
    return list;
  }

  // Sonda de diagnóstico: cuántas filas de "palabras" ve realmente el cliente.
  async function probeContent() {
    const { count, error } = await dbClient.from('palabras').select('id', { count: 'exact', head: true });
    if (error) { console.error('[probeContent] ❌ No se pudo leer "palabras":', error.message, error); return { ok: false, count: 0 }; }
    console.log('[probeContent] ✅ filas visibles en "palabras":', count);
    return { ok: true, count: count || 0 };
  }

  // Palabras cuyo próximo repaso ya venció (SRS), de TODOS LOS NIVELES.
  //
  // ⚠️ Antes esta consulta se limitaba al nivel actual (.eq('nivel', nivel)).
  //    Eso hacía que, al pasar de A1 a A2, los repasos pendientes de A1
  //    desaparecieran: seguían vencidos en el SRS, pero la consulta los
  //    descartaba y el usuario perdía esas palabras a medio dominar.
  //    Ahora se traen por ID sin filtrar por nivel, así sigues repasando
  //    A1 aunque estés estudiando A2 (sin tener que cambiar de nivel).
  //
  // Excluye las dominadas (learned), prioriza las más difíciles/vencidas y
  // limita la sesión a SRS_SESSION_MAX (30) palabras.
  async function getDueReviews(nivel) {
    const now = Date.now();
    const hoy = todayStr();
    const dueIds = Object.entries(flujo.srs)
      .filter(([, v]) => !v.learned && v.due && new Date(v.due).getTime() <= now)
      // Tope diario: una palabra ya vista SRS_MAX_SHOWS_PER_DAY veces hoy no vuelve a salir hoy.
      .filter(([, v]) => (v.day !== hoy) || ((v.shownToday || 0) < SRS_MAX_SHOWS_PER_DAY))
      .sort((a, b) => {
        const da = a[1].difficult ? 1 : 0, db = b[1].difficult ? 1 : 0;
        if (db !== da) return db - da; // primero las marcadas DIFÍCILES
        const la = a[1].lapses || 0, lb = b[1].lapses || 0;
        if (lb !== la) return lb - la; // luego las que más cuestan
        return new Date(a[1].due) - new Date(b[1].due); // luego las más vencidas
      })
      .map(([id]) => parseInt(id))
      .filter(n => !isNaN(n))
      .slice(0, SRS_SESSION_MAX);
    if (!dueIds.length) return [];
    const { data, error } = await dbClient.from('palabras').select('*').in('id', dueIds);
    if (error) { console.error('[getDueReviews] ❌', error.message, error); return []; }
    const orden = new Map(dueIds.map((id, i) => [id, i]));
    const lista = (data || []).sort((a, b) => (orden.get(a.id) ?? 99) - (orden.get(b.id) ?? 99)).slice(0, SRS_SESSION_MAX);
    const otros = [...new Set(lista.map(w => (w.nivel || '').trim()).filter(v => v && v.toLowerCase() !== (nivel || '').toLowerCase()))];
    if (otros.length) console.log('[getDueReviews] incluye repasos de otros niveles:', otros.join(', '));
    return lista;
  }

  /* ============================================================
     6. INICIALIZACIÓN DEL FLUJO (JSON columna "flujo")
  ============================================================ */
  function defaultGroupState() {
    return {
      review: { done: false, index: 0 },
      practice: { done: false, queue: [], index: 0 },
      chat: { done: false, count: 0 },   // 💬 última práctica: hablar con Abu
      completed: false, correct: 0, wrong: 0
    };
  }
  function defaultFlujo(nivel) {
    return {
      version: 3,
      currentNivel: nivel,
      niveles: {},
      srs: {},
      stats: { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 },
      daily: { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null },
      racha: { days: 0, last: null, best: 0 }
    };
  }

  async function ensureFlujo() {
    const baseNivel = (userProfile.nivel) || 'A1';

    // Migración: si viene el formato viejo (flowState) o no existe, se reinicia a v2.
    if (!flujo || !flujo.version || flujo.version < 2 || flujo.flowState) {
      const old = flujo || {};
      flujo = defaultFlujo(baseNivel);
      if (old.currentGroup) { /* se conserva el punto de partida como referencia */ }
      // Importa el SRS previo desde user_word_progress para no perder el progreso.
      const { data: prev } = await dbClient.from('user_word_progress').select('*').eq('user_id', currentUser.id);
      (prev || []).forEach(p => {
        flujo.srs[String(p.word_id)] = {
          level: p.srs_level || 0,
          ease: parseFloat(p.ease_factor) || EASE_DEFAULT,
          reps: p.srs_level || 0, lapses: 0,
          due: p.next_review_at || new Date().toISOString()
        };
      });
      await updateUserFlow();
    }
    if (!flujo.currentNivel) flujo.currentNivel = baseNivel;
    if (!flujo.srs) flujo.srs = {};
    if (!flujo.stats) flujo.stats = { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 };
    // Migración suave v2 → v3 (sin perder progreso): agrega estado diario, racha y campos SRS nuevos.
    ensureDaily();
    Object.values(flujo.srs).forEach(s => {
      if (s.learned === undefined) s.learned = false;
      if (!s.first) s.first = {};
      if (s.easyFirst === undefined) s.easyFirst = false;
      // Campos nuevos del refuerzo de palabras difíciles y tope diario.
      if (s.difficult === undefined) s.difficult = (s.lapses || 0) >= 2; // las que ya costaban entran al refuerzo
      if (s.okStreak === undefined) s.okStreak = 0;
      if (s.shownToday === undefined) { s.shownToday = 0; s.day = null; }
      // Palabras que ya alcanzaron el intervalo máximo se gradúan (si no son difíciles).
      if (!s.learned && (s.level || 0) >= GRADUATED_LEVEL && !s.difficult) { s.learned = true; s.due = null; }
    });
    if (flujo.version < 3) { flujo.version = 3; await updateUserFlow(); }
  }

  async function ensureNivel(nivel) {
    if (!flujo.niveles[nivel]) flujo.niveles[nivel] = { currentGroup: null, grupos: {} };
    const n = flujo.niveles[nivel];
    const groups = await getGroups(nivel); // solo grupos que realmente tienen palabras
    if (!groups.length) { n.currentGroup = null; return n; } // nivel sin contenido

    // Validar el grupo guardado contra los grupos reales. Si es inválido o no existe,
    // elegimos el primer grupo aún no completado (o el primero disponible).
    if (!n.currentGroup || !groups.includes(n.currentGroup)) {
      const firstIncomplete = groups.find(g => !(n.grupos[g] && n.grupos[g].completed));
      n.currentGroup = firstIncomplete || groups[0];
    }
    if (!n.grupos[n.currentGroup]) n.grupos[n.currentGroup] = defaultGroupState();

    // Migración: grupos creados antes de existir la práctica de conversación.
    // Los que ya estaban completados NO tienen que repetir la charla.
    Object.values(n.grupos).forEach(g => {
      if (!g.chat) g.chat = g.completed ? { done: true, count: CHAT_GOAL } : { done: false, count: 0 };
    });
    return n;
  }

  /* ============================================================
     7. CONTROLADOR DE FLUJO ÚNICO
     Prioridad: (1) repasos SRS vencidos  →  (2) repaso del grupo  →  (3) práctica  →  (4) siguiente grupo
  ============================================================ */
  async function runFlow() {
    toolsBar.classList.remove('hidden');
    console.groupCollapsed('%c[runFlow]', 'color:#FF7A00;font-weight:bold');
    console.log('flujo actual:', JSON.parse(JSON.stringify(flujo)));

    // Sonda: ¿el cliente puede leer la tabla "palabras"?
    const probe = await probeContent();
    if (probe.count === 0) {
      console.warn('La consulta a "palabras" devolvió 0 filas. Causa más probable: falta la política RLS de SELECT en la tabla "palabras".');
      console.groupEnd();
      return renderMessage('🔒', 'No se pueden leer las palabras',
        'La base de datos devolvió <b>0 palabras</b>. Si ya las cargaste, falta la política <b>RLS de SELECT</b> en la tabla <b>palabras</b>. Aplica el SQL de permisos y recarga.',
        'Reintentar', () => window.location.reload());
    }

    // Niveles que realmente tienen palabras cargadas.
    const niveles = await getNiveles();

    // Si el nivel guardado no tiene contenido, saltamos al primero que sí lo tenga.
    if (niveles.length && !niveles.includes(flujo.currentNivel)) {
      console.log(`[runFlow] "${flujo.currentNivel}" sin contenido → cambio a "${niveles[0]}"`);
      flujo.currentNivel = niveles[0];
      await updateUserFlow();
    }

    const nivel = flujo.currentNivel;
    document.getElementById('nivel-label').textContent = nivel;
    const n = await ensureNivel(nivel);
    console.log(`[runFlow] nivel=${nivel} · currentGroup=${n.currentGroup}`);

    // Nivel sin grupos con palabras: ofrecer cambiar de nivel.
    if (!n.currentGroup) {
      console.groupEnd();
      return renderMessage('📭', 'Nivel sin contenido',
        `No hay palabras cargadas para el nivel <b>${nivel}</b>. Elige otro nivel o carga palabras para este.`,
        'Elegir otro nivel', openNivelSelector);
    }

    // (1) Repasos espaciados vencidos
    const due = await getDueReviews(nivel);
    if (due.length) { console.log('[runFlow] repasos SRS vencidos:', due.length); console.groupEnd(); return startSrsReview(due); }

    // (2)/(3)/(4) Progresión por grupos
    const group = n.currentGroup;
    if (!n.grupos[group]) n.grupos[group] = defaultGroupState();
    const g = n.grupos[group];

    const words = await getGroupWords(nivel, group);
    if (!words.length) {
      console.groupEnd();
      return renderMessage('📭', 'Grupo sin contenido',
        `El grupo <b>${group}</b> del nivel <b>${nivel}</b> no tiene palabras.`,
        'Elegir otro nivel', openNivelSelector);
    }

    console.log(`[runFlow] estado grupo ${group}: review.done=${g.review.done} practice.done=${g.practice.done}`);
    console.groupEnd();

    if (!g.review.done) return renderReview(nivel, group, words);
    if (!g.practice.done) return renderPractice(nivel, group);
    if (!g.chat || !g.chat.done) return chatPracticeIntro(nivel, group); // 💬 hablar con Abu
    return advanceGroup(nivel, group);
  }

  /* ------------------------------------------------------------
     Descanso entre tandas de palabras nuevas.
     Dice la hora exacta a la que se habilitan más palabras y va
     descontando el tiempo en vivo. Los repasos siguen disponibles.
  ------------------------------------------------------------ */
  let pauseTimer = null;
  function renderNewWordsPause(nivel) {
    ensureDaily();
    const unlockMs = flujo.daily.unlockAt ? new Date(flujo.daily.unlockAt).getTime() : Date.now();
    const hora = new Date(unlockMs).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    const manana = new Date(unlockMs).toDateString() !== new Date().toDateString();

    renderMessage('🌙', 'Seguiremos más tarde',
      `Ya estudiaste <b>${NEW_WORDS_PER_TANDA} palabras nuevas</b> en esta tanda: es el máximo que tu memoria fija bien de una sola vez.<br>
       <span class="block mt-3 text-slate-600">Se habilitan más palabras <b class="text-[#FF7A00]">a las ${hora}${manana ? ' de mañana' : ''}</b></span>
       <span id="pause-countdown" class="block mt-1 text-sm font-bold text-slate-400">faltan ${fmtEspera(unlockMs - Date.now())}</span>
       <span class="block mt-3 text-xs text-slate-400">Mientras tanto puedes repasar lo aprendido: los repasos no tienen límite. 🧠</span>`,
      'Repasar lo aprendido 🧠', async () => {
        const due = await getDueReviews(nivel);
        if (due.length) return startSrsReview(due);
        renderMessage('😴', 'Todo al día',
          `No tienes repasos pendientes. Descansa: a las <b>${hora}</b> te esperan palabras nuevas. 🌙`);
      });

    // Cuenta atrás en vivo + recarga automática cuando se cumple el tiempo
    clearInterval(pauseTimer);
    pauseTimer = setInterval(() => {
      const el = document.getElementById('pause-countdown');
      if (!el) { clearInterval(pauseTimer); return; }
      const resta = unlockMs - Date.now();
      if (resta <= 0) {
        clearInterval(pauseTimer);
        showToast('🎉 ¡Ya puedes estudiar palabras nuevas!');
        ensureDaily();
        runFlow();
        return;
      }
      el.textContent = `faltan ${fmtEspera(resta)}`;
    }, 20000);
  }

  /* ============================================================
     8. PASO 1 — REPASO DEL GRUPO (flashcards de todas las palabras)
  ============================================================ */
  async function renderReview(nivel, group, words) {
    const g = flujo.niveles[nivel].grupos[group];
    reviewList = words;
    const i = g.review.index || 0;

    if (i >= reviewList.length) {
      g.review.done = true;
      await updateUserFlow();
      await addPoints(5);
      showEncouragement(() => runFlow());
      return;
    }

    const word = reviewList[i];

    // Límite por tanda: NEW_WORDS_PER_TANDA palabras NUEVAS y descanso de medio día.
    const esNueva = !flujo.srs[String(word.id)];
    if (esNueva && newWordsLocked()) {
      updateProgressBar(100);
      return renderNewWordsPause(nivel);
    }

    updateProgressBar((i / reviewList.length) * 100);
    appContainer.innerHTML = flashcardHTML(word, i + 1, reviewList.length);
    bindFlashcard(word, async (result) => {
      await updateSRS(word.id, result, { type: 'flashcard' }); // 'easy' | 'hard' (siembra el SRS)
      g.review.index = i + 1;
      await updateUserFlow();
      renderReview(nivel, group, words);
    });
  }

  /* Etiqueta de nivel: solo aparece cuando la palabra viene de un nivel
     distinto al que estás estudiando (repaso pendiente de A1 mientras
     avanzas en A2, por ejemplo). Así sabes de dónde salió la palabra. */
  function nivelBadgeHTML(word) {
    const n = (word?.nivel || '').trim();
    const actual = (flujo?.currentNivel || '').trim();
    if (!n || n.toLowerCase() === actual.toLowerCase()) return '';
    return `<span class="bg-orange-100 text-[#FF7A00] px-2 py-1 rounded-full text-[10px] font-black uppercase tracking-widest" title="Repaso pendiente del nivel ${escapeHTML(n)}">🔁 ${escapeHTML(n)}</span>`;
  }

  function flashcardHTML(word, pos, total) {
    const fon = word.fonetica ? `/${word.fonetica}/` : '—';
    const img = word.imagen
      ? `<img src="${word.imagen}" class="h-full object-contain transition-transform duration-500 group-hover:scale-110" alt="${word.espanol || ''}">`
      : `<div class="text-slate-300 text-6xl"><i class="fas fa-image"></i></div>`;
    return `
      <div class="card-3d p-4 sm:p-6 text-center relative animate-pop mt-1">

          <span class="flex items-center gap-1.5">
            <span class="bg-green-100 text-green-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest">✨ Repaso</span>
            ${nivelBadgeHTML(word)}
          </span>
          <span class="text-xs font-bold text-slate-400">${pos} / ${total}</span>
        </div>

        <div class="w-full h-40 sm:h-52 bg-slate-50 rounded-2xl mb-4 overflow-hidden flex items-center justify-center border border-slate-100 relative shadow-inner">
          ${img}
        </div>

        <div class="relative flex items-center justify-center mb-1 min-h-[3.25rem] -mx-4 sm:-mx-6">
          <h1 class="text-4xl sm:text-5xl font-black font-heading text-[#FF7A00] tracking-tight text-center px-14">${word.ingles}</h1>
          <button id="btn-word-audio" title="Escuchar pronunciación" class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-400 hover:text-slate-600 text-base transition flex items-center justify-center">
            <i class="fas fa-volume-up"></i>
          </button>
        </div>

        <div class="h-9 mb-2 flex items-center justify-center">
          <button id="btn-show-phonetic" class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 text-xs font-bold border border-slate-200 rounded-full px-3 py-1 transition-all flex items-center gap-2">
            <i class="fas fa-eye"></i> Ver fonética
          </button>
          <span id="txt-phonetic" class="hidden text-slate-500 font-mono text-base sm:text-lg bg-slate-100 px-3 py-1 rounded-lg border border-slate-200 tracking-wide">${fon}</span>
        </div>

        <!-- El significado en español también va OCULTO (como la fonética):
             primero intentas recordarlo tú y luego lo revelas. Recordar

    sfx('flip');
    setTimeout(() => playWordAudio(word), 350);
    const btnAudio = document.getElementById('btn-word-audio');
    if (btnAudio) btnAudio.onclick = (e) => { e.stopPropagation(); playWordAudio(word); };

  /* ============================================================
     9. PASO 2 — PRÁCTICA (audio→escribir  /  imagen→elegir)
  ============================================================ */
  /*
    CADA palabra lleva SUS DOS ejercicios: 👁️ Identifica la imagen y 👂 Escucha y escribe.
    Esto es lo que permite marcarla como DOMINADA a la primera: updateSRS exige el
    primer intento correcto de AMBOS tipos (más "Fácil" en la tarjeta y cero fallos).
    Con un solo ejercicio por palabra ese requisito nunca se cumplía y casi nada
    llegaba a "dominada".
    Las palabras sin imagen solo llevan el de audio; para ellas el dominio no
    exige el ejercicio de imagen.
    Orden: primero la ronda de imágenes, después la de dictados. Así los dos
    ejercicios de una misma palabra quedan separados, que es como mejor se fija.
  */
  async function buildPracticeQueue(nivel, group) {
    const words = await getGroupWords(nivel, group);
    const englishPool = words.map(w => w.ingles);

    const ronda1 = [], ronda2 = [];
    words.forEach(w => {
      if (w.imagen) {
        ronda1.push({ word_id: w.id, type: 'select_by_image', options: buildOptions(w.ingles, englishPool) });
      }
      // El audio tiene respaldo por voz del navegador, así que siempre se puede.
      ronda2.push({ word_id: w.id, type: 'write_by_audio', options: null });
    });
    // Ya NO va primero toda la ronda de imágenes y luego toda la de dictados:
    // los dos tipos se INTERCALAN al azar, cuidando que los dos ejercicios de
    // una misma palabra no queden pegados (así se fija mejor).
    const g = flujo.niveles[nivel].grupos[group];
    g.practice = { done: false, queue: mezclarEjercicios([...ronda1, ...ronda2]), index: 0 };
    await updateUserFlow();
  }

  /*
    Mezcla aleatoria de ejercicios evitando que la MISMA palabra
    aparezca dos veces seguidas (sus dos ejercicios quedan separados).
  */
  function mezclarEjercicios(lista) {
    const arr = [...lista];
    // Fisher–Yates
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    // Separar repetidos adyacentes (varias pasadas y sin crear nuevos choques)
    const idDe = (e) => String(e.word_id ?? e.word?.id ?? '');
    for (let pasada = 0; pasada < 4; pasada++) {
      let hubo = false;
      for (let i = 1; i < arr.length; i++) {
        if (idDe(arr[i]) !== idDe(arr[i - 1])) continue;
        // Buscar en cualquier posición un candidato que no genere nueva adyacencia
        const k = arr.findIndex((e, idx) => {
          if (idx === i || idx === i - 1) return false;
          if (idDe(e) === idDe(arr[i - 1])) return false;
          const prev = arr[idx - 1], next = arr[idx + 1];
          if (prev && idDe(prev) === idDe(arr[i])) return false;
          if (next && idx + 1 !== i && idDe(next) === idDe(arr[i])) return false;
          return true;
        });
        if (k !== -1) { [arr[i], arr[k]] = [arr[k], arr[i]]; hubo = true; }
      }
      if (!hubo) break;
    }
    return arr;
  }

  // Cuántos ejercicios debería tener el grupo con la regla de dos por palabra
  function tamanoEsperadoCola(words) {
    return words.length + words.filter(w => w.imagen).length;
  }

  function buildOptions(correct, pool) {
    const distractors = pool.filter(x => x !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
    return [correct, ...distractors].sort(() => Math.random() - 0.5);
  }

  async function renderPractice(nivel, group) {
    const g = flujo.niveles[nivel].grupos[group];

    // Cargamos las palabras reales del grupo primero.
    const words = await getGroupWords(nivel, group);
    const validIds = new Set(words.map(w => String(w.id)));

    // Construir la cola si no existe, o regenerarla si quedó obsoleta
    // (p. ej. word_id que ya no pertenecen a este grupo).
    const colaCompleta = g.practice.queue && g.practice.queue.length >= tamanoEsperadoCola(words);
    const queueOk = g.practice.queue && g.practice.queue.length &&
      g.practice.queue.every(ex => validIds.has(String(ex.word_id))) &&
      // Colas viejas (una sola práctica por palabra): se rehacen si aún no empezó
      (colaCompleta || (g.practice.index || 0) > 0);
    if (!queueOk) {
      console.warn(`[renderPractice] cola inválida/obsoleta en ${nivel}/${group} → regenerando`);
      g.practice.index = 0;
      await buildPracticeQueue(nivel, group);
    }

    const q = g.practice.queue;
    const i = g.practice.index || 0;

    if (i >= q.length) {
      g.practice.done = true;
      await updateUserFlow();
      // Falta la última práctica: usar estas palabras hablando con Abu.
      return showEncouragement(() => runFlow());
    }

    const ex = q[i];
    const word = groupCache.map[String(ex.word_id)];
    if (!word) { g.practice.index = i + 1; await updateUserFlow(); return renderPractice(nivel, group); }

    updateProgressBar((i / q.length) * 100);
    console.log(`[practica] ${i + 1}/${q.length} · ${ex.type} · ${word.ingles}`);

    const advance = async (isCorrect) => {
      const gg = flujo.niveles[nivel].grupos[group];
      if (isCorrect) gg.correct++; else gg.wrong++;
      gg.practice.index = i + 1;
      await updateSRS(word.id, isCorrect ? 'practice_correct' : 'practice_wrong', { type: ex.type });
      await updateUserFlow();
      // Mensaje de ánimo cada 5 aciertos
      if (isCorrect && sessionCorrect > 0 && sessionCorrect % 5 === 0 && sessionCorrect !== lastMilestone) {
        lastMilestone = sessionCorrect;
        setTimeout(() => showEncouragement(() => renderPractice(nivel, group)), 900);
      } else {
        setTimeout(() => renderPractice(nivel, group), isCorrect ? 1000 : 2000);
      }
    };

    if (ex.type === 'select_by_image') renderSelectImage(word, ex.options, advance);
    else renderWriteAudio(word, advance);
  }

  /* ============================================================
     10. REPASO SRS (sesión de palabras vencidas)
  ============================================================ */
  function startSrsReview(words) {
    srsSession = { queue: words.slice(0, SRS_SESSION_MAX), index: 0, aciertos: 0 };
    // Los repasos ya NO se limitan al nivel actual: si quedaron palabras
    // pendientes de niveles anteriores, se avisa para que no sorprenda.
    const niveles = sortNiveles([...new Set(srsSession.queue.map(w => (w.nivel || '').trim()).filter(Boolean))]);
    const nivelActual = flujo?.currentNivel || '';
    const previos = niveles.filter(n => n.toLowerCase() !== nivelActual.toLowerCase());
    const aviso = previos.length
      ? `<span class="block mt-2 text-xs font-bold text-[#FF7A00]">Incluye palabras de ${previos.join(' · ')} que aún no dominas 🔁</span>`
      : '';
    renderMessage('🧠', '¡Toca repasar!',
      `Tienes <b>${srsSession.queue.length}</b> palabra(s) que tu memoria está a punto de olvidar. Vamos a reforzarlas.${aviso}<br><span class="text-xs text-slate-400">(máximo ${SRS_SESSION_MAX} por sesión para no saturarte)</span>`,
      'Empezar repaso', () => nextSrsReview());
  }
  async function nextSrsReview() {
    if (!srsSession || srsSession.index >= srsSession.queue.length) {
      const aciertos = srsSession ? srsSession.aciertos : 0;
      const total = srsSession ? srsSession.queue.length : 0;
      srsSession = null;
      flujo.stats.sessionsCompleted = (flujo.stats.sessionsCompleted || 0) + 1;
      await updateUserFlow();
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '🧠', title: '¡Repaso terminado!',
        body: `Has fortalecido tu memoria a largo plazo.<br><span class="text-green-600 font-bold">${aciertos}/${total} aciertos</span>`,
        dismissable: false,
        actions: [{ label: 'Continuar', onClick: () => { closeModal(); runFlow(); } }]
      });
      return;
    }
    const word = srsSession.queue[srsSession.index];
    updateProgressBar((srsSession.index / srsSession.queue.length) * 100);

    const s = flujo.srs[String(word.id)] || {};
    const esDebil = (s.lapses || 0) >= 3 || (s.level || 0) === 0; // le cuesta: mejor volver a estudiarla

    const avanzar = async (result, type, fueBien) => {
      await updateSRS(word.id, result, { type, word });
      ensureDaily();
      flujo.daily.reviewed = (flujo.daily.reviewed || 0) + 1;
      if (fueBien) srsSession.aciertos++;
      srsSession.index++;
      setTimeout(() => nextSrsReview(), fueBien ? 1000 : 2000);
    };

    /*
      Mezcla ALEATORIA de formatos dentro de "¡Toca repasar!":
      tarjeta ✨ Repaso, 👁️ Identifica la imagen y 👂 Escucha y escribe
      salen al azar (sin un orden fijo). Así el usuario también puede
      completar los ejercicios que le faltan para DOMINAR la palabra.
      Si la palabra está muy débil, la tarjeta tiene un poco más de
      probabilidad para volver a estudiarla, pero nunca es lo único.
    */
    const modos = ['flashcard', 'write_by_audio'];
    if (word.imagen) modos.push('select_by_image');
    let modo;
    if (esDebil && Math.random() < 0.5) modo = 'flashcard';
    else modo = modos[Math.floor(Math.random() * modos.length)];

    if (modo === 'flashcard') {
      appContainer.innerHTML = flashcardHTML(word, srsSession.index + 1, srsSession.queue.length);
      bindFlashcard(word, (res) => avanzar(res, 'flashcard', res === 'easy'));
    } else if (modo === 'select_by_image') {
      const pool = (groupCache.list.length ? groupCache.list : srsSession.queue).map(w => w.ingles);
      renderSelectImage(word, buildOptions(word.ingles, pool.length >= 4 ? pool : [word.ingles, 'yes', 'no', 'time']),
        (ok) => avanzar(ok ? 'practice_correct' : 'practice_wrong', 'select_by_image', ok));
    } else {
      renderWriteAudio(word, (ok) => avanzar(ok ? 'practice_correct' : 'practice_wrong', 'write_by_audio', ok));
    }
  }

      dismissable: false,

  async function advanceGroup(nivel, group) {
    const groups = await getGroups(nivel);
    const idx = groups.indexOf(group);
    const next = groups[idx + 1];

    if (next) {
      flujo.niveles[nivel].currentGroup = next;
      if (!flujo.niveles[nivel].grupos[next]) flujo.niveles[nivel].grupos[next] = defaultGroupState();
      groupCache = { key: null, list: [], map: {} };
      await updateUserFlow();
      runFlow();
    } else {
      // Nivel terminado
      playSound('complete'); triggerConfetti();
      // El certificado no se gana por terminar los grupos, sino por tener
      // TODAS las palabras del nivel dominadas. Aquí se le dice cuánto falta.
      const cert = await getCertProgreso(nivel);
      const notaCert = cert.listo
        ? `<span class="block mt-3 text-green-600 font-bold">🎓 ¡Dominaste las ${cert.total} palabras! Tu certificado del nivel ${nivel} ya está disponible.</span>`
        : `<span class="block mt-3 text-slate-500">Para tu <b>certificado del nivel ${nivel}</b> te faltan <b class="text-[#FF7A00]">${cert.faltan} palabra${cert.faltan === 1 ? '' : 's'}</b> por dominar. Puedes seguir repasándolas aunque cambies de nivel. 🔁</span>`;
      showModal({
        icon: '🎓',
        title: `¡Nivel ${nivel} completado!`,
        body: `Dominaste todos los grupos de este nivel. ¿Subimos de nivel?${notaCert}`,
        dismissable: false,
        actions: [
          { label: 'Elegir nivel', onClick: () => { closeModal(); openNivelSelector(); } },
          { label: cert.listo ? 'Pedir mi certificado 📜' : 'Ver certificados 🎓', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); openCertificados(); } },
          { label: 'Repasar lo aprendido', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); runFlow(); } }
        ]
      });
    }
  }
